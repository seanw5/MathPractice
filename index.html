<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grade 6&ndash;7 Math Practice</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --border: #e2e8f2;
    --text: #1a2332;
    --dim: #6b7488;
    --accent: #3d7dfb;
    --accent-dim: #e9f0ff;
    --green: #1a9e6b;
    --green-dim: #e6f7ef;
    --red: #e0453f;
    --red-dim: #fdeceb;
    --amber: #b5750a;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(20, 30, 60, 0.06), 0 8px 24px rgba(20, 30, 60, 0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { padding: 28px 16px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 22px; }
  header h1 { font-size: 25px; margin: 0 0 4px; letter-spacing: -0.3px; }
  header p { color: var(--dim); margin: 0; font-size: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 18px;
  }

  .section-title {
    font-size: 16px;
    margin: 0 0 14px;
    text-align: center;
  }
  .grade-options {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .grade-btn {
    flex: 1;
    min-width: 220px;
    text-align: left;
    padding: 16px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: all 0.12s;
  }
  .grade-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
  .grade-btn .grade-num { font-size: 17px; font-weight: 700; color: var(--text); }
  .grade-btn .grade-desc { font-size: 13px; color: var(--dim); line-height: 1.4; }

  .grade-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px 12px;
    font-size: 13.5px;
    color: var(--dim);
  }

  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .topic-btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--dim);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.12s;
  }
  .topic-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topic-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .topic-group { margin-top: 14px; }
  .topic-group:first-child { margin-top: 0; }
  .topic-group-label {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 7px;
  }
  .topic-group-buttons { display: flex; flex-wrap: wrap; gap: 8px; }

  .visual {
    margin: 4px 0 14px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fbfcfe;
    overflow-x: auto;
  }
  .visual svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .visual table { border-collapse: collapse; margin: 0 auto; font-size: 14px; }
  .visual td, .visual th { border: 1px solid var(--border); padding: 5px 12px; text-align: center; }
  .visual th { background: var(--accent-dim); color: var(--text); font-weight: 700; }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
  }
  .stats {
    display: flex;
    gap: 22px;
  }
  .stat { text-align: left; }
  .stat .num { font-size: 19px; font-weight: 700; }
  .stat .lbl { font-size: 11.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat.streak .num { color: var(--accent); }
  .stat.accuracy .num { color: var(--green); }
  button.reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.reset-btn:hover { border-color: var(--red); color: var(--red); }

  .problem-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .topic-tag {
    display: inline-block;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .progress-tag {
    font-size: 12.5px;
    color: var(--dim);
    font-weight: 600;
  }

  .summary-score {
    font-size: 40px;
    font-weight: 800;
    text-align: center;
    color: var(--accent);
    margin-top: 10px;
  }
  .summary-label {
    text-align: center;
    color: var(--dim);
    font-size: 14.5px;
    margin: 6px 0 20px;
  }
  .summary-breakdown {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 20px;
  }
  .breakdown-stat { text-align: center; }
  .breakdown-stat .num { font-size: 22px; font-weight: 800; }
  .breakdown-stat .lbl { font-size: 11.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .breakdown-stat.correct-stat .num { color: var(--green); }
  .breakdown-stat.wrong-stat .num { color: var(--red); }
  #summaryArea .primary { display: block; margin: 0 auto; }

  .review-heading {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--dim);
    margin: 28px 0 12px;
    text-align: center;
  }
  .review-list {
    max-height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 2px 2px 4px;
  }
  .review-item {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .review-item.item-correct { border-left: 4px solid var(--green); }
  .review-item.item-wrong { border-left: 4px solid var(--red); }
  .review-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .review-item-num { font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .review-badge {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .review-badge.correct { background: var(--green-dim); color: var(--green); }
  .review-badge.wrong { background: var(--red-dim); color: var(--red); }
  .review-question { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .review-answer-line { font-size: 13.5px; color: var(--dim); margin-bottom: 4px; }
  .review-answer-line b { color: var(--text); font-weight: 600; }
  .review-answer-line.wrong-value b { color: var(--red); }
  .review-answer-line.correct-value b { color: var(--green); }
  .review-steps {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 13.5px;
    color: var(--text);
    opacity: 0.85;
    line-height: 1.5;
  }
  .review-steps .steps-label { font-weight: 700; opacity: 1; margin-right: 4px; }

  .question {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.4;
    letter-spacing: -0.2px;
  }
  .hint {
    font-size: 12.5px;
    color: var(--dim);
    margin-bottom: 8px;
  }

  .answer-row {
    display: flex;
    gap: 10px;
  }
  #answerInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-size: 17px;
    font-family: inherit;
    color: var(--text);
  }
  #answerInput:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  #answerInput:disabled { background: #f7f8fb; color: var(--dim); }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0 22px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary.next { background: var(--green); }

  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 15px;
    display: none;
  }
  .feedback.correct {
    display: block;
    background: var(--green-dim);
    color: var(--green);
  }
  .feedback.incorrect {
    display: block;
    background: var(--red-dim);
    color: var(--red);
  }
  .feedback .headline { font-weight: 700; margin-bottom: 6px; }
  .feedback .solution {
    color: var(--text);
    opacity: 0.85;
    font-size: 14px;
    line-height: 1.55;
    font-weight: 400;
  }

  .empty-state {
    text-align: center;
    color: var(--dim);
    padding: 30px 10px;
    font-size: 14.5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Grade 6&ndash;7 Math Practice</h1>
    <p>Based on the Ontario Mathematics Curriculum (2020). Pick a topic and work through problems, one at a time.</p>
  </header>

  <div class="card" id="gradeGate">
    <h2 class="section-title">Which grade are you practicing?</h2>
    <div class="grade-options">
      <button type="button" class="grade-btn" data-grade="6">
        <span class="grade-num">Grade 6</span>
        <span class="grade-desc">Compare integers, fractions &amp; decimals, divisibility &amp; prime factors, ratios &amp; rates, linear patterns, equations &amp; inequalities, mean/median/mode/range, probability, angles, trapezoids &amp; surface area, coordinates</span>
      </button>
      <button type="button" class="grade-btn" data-grade="7">
        <span class="grade-num">Grade 7</span>
        <span class="grade-desc">Integer add/subtract, fractions &amp; decimals multiply/divide, exponents &amp; GCF/LCM, proportional reasoning, percent change, equations with decimals, dependent events, circles &amp; cylinders, dilations, currency exchange</span>
      </button>
    </div>
  </div>

  <div id="mainArea" style="display:none;">
    <div class="grade-bar">
      <span>Practicing <b id="currentGradeLabel"></b></span>
      <button type="button" class="reset-btn" id="changeGradeBtn">Change grade</button>
    </div>

    <div class="card">
      <div class="topics" id="topicButtons"></div>
    </div>

    <div class="card stats-bar">
      <div class="stats">
        <div class="stat">
          <div class="num" id="scoreNum">0 / 0</div>
          <div class="lbl">Score</div>
        </div>
        <div class="stat streak">
          <div class="num" id="streakNum">0</div>
          <div class="lbl">Streak</div>
        </div>
        <div class="stat accuracy">
          <div class="num" id="accuracyNum">&mdash;</div>
          <div class="lbl">Accuracy</div>
        </div>
      </div>
      <button type="button" class="reset-btn" id="resetBtn">Reset stats</button>
    </div>

    <div class="card" id="problemCard">
      <div class="empty-state" id="emptyState">Choose a topic above to start practicing.</div>
      <div id="problemArea" style="display:none;">
        <div class="problem-header">
          <div class="topic-tag" id="topicTag"></div>
          <div class="progress-tag" id="progressTag"></div>
        </div>
        <div class="question" id="questionText"></div>
        <div class="visual" id="questionVisual" style="display:none;"></div>
        <div class="hint" id="answerHint"></div>
        <div class="answer-row">
          <input type="text" id="answerInput" autocomplete="off" placeholder="Your answer" />
          <button type="button" class="primary" id="actionBtn" disabled>Check</button>
        </div>
        <div class="feedback" id="feedback">
          <div class="headline" id="feedbackHeadline"></div>
          <div class="solution" id="feedbackSolution"></div>
        </div>
      </div>
      <div id="summaryArea" style="display:none;">
        <div class="summary-score" id="summaryScore"></div>
        <div class="summary-label" id="summaryLabel"></div>
        <div class="summary-breakdown">
          <div class="breakdown-stat correct-stat">
            <div class="num" id="summaryCorrectCount"></div>
            <div class="lbl">Correct</div>
          </div>
          <div class="breakdown-stat wrong-stat">
            <div class="num" id="summaryWrongCount"></div>
            <div class="lbl">Wrong</div>
          </div>
        </div>
        <button type="button" class="primary" id="practiceAgainBtn">Practice again</button>
        <div class="review-heading">Review your answers</div>
        <div class="review-list" id="reviewList"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'mathPractice67_stats_v1';

  // ---------- math helpers ----------
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
  function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }
  function reduceFrac(n, d) {
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  function fracStr(n, d) {
    if (d < 0) { n = -n; d = -d; }
    if (d === 1) return `${n}`;
    return `${n}/${d}`;
  }
  function mixedStr(n, d) {
    if (d === 1) return `${n}`;
    const neg = n < 0, a = Math.abs(n);
    const w = Math.floor(a / d), r = a % d;
    if (w === 0) return fracStr(n, d);
    const sign = neg ? '-' : '';
    return r === 0 ? `${sign}${w}` : `${sign}${w} ${r}/${d}`;
  }
  function fracDisplay(n, d) {
    return d > 1 && Math.abs(n) > d ? `${fracStr(n, d)} (or ${mixedStr(n, d)})` : fracStr(n, d);
  }
  function fmtSigned(n) { return n < 0 ? `(${n})` : `${n}`; }
  function r6(x) { return Math.round(x * 1e6) / 1e6; }
  function n2s(x) { return String(r6(x)); }
  function round2(x) { return Math.round(x * 100) / 100; }
  function money(x) { return '$' + (Math.round(x * 100) / 100).toFixed(2); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  const SUPDIGITS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  function sup(n) { return String(n).split('').map(c => SUPDIGITS[+c]).join(''); }
  function fmtBig(n) {
    const s = String(Math.abs(n));
    const out = s.length >= 5 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : s;
    return (n < 0 ? '-' : '') + out;
  }
  function plural(n, one, many) { return n === 1 ? one : many; }

  // ---------- units accepted alongside a numeric answer ----------
  function normUnit(s) {
    return String(s).toLowerCase().replace(/²/g, '2').replace(/³/g, '3').replace(/[\s.^_·]/g, '');
  }
  const UNIT_ALIASES = {
    mm: ['mm', 'millimetre', 'millimetres', 'millimeter', 'millimeters'],
    cm: ['cm', 'centimetre', 'centimetres', 'centimeter', 'centimeters'],
    m: ['m', 'metre', 'metres', 'meter', 'meters'],
    km: ['km', 'kilometre', 'kilometres', 'kilometer', 'kilometers'],
    g: ['g', 'gram', 'grams'],
    kg: ['kg', 'kilogram', 'kilograms'],
    mL: ['ml', 'millilitre', 'millilitres', 'milliliter', 'milliliters'],
    L: ['l', 'litre', 'litres', 'liter', 'liters'],
    cm2: ['cm2', 'sqcm', 'squarecm', 'squarecentimetre', 'squarecentimetres', 'squarecentimeter', 'squarecentimeters'],
    m2: ['m2', 'sqm', 'squarem', 'squaremetre', 'squaremetres', 'squaremeter', 'squaremeters'],
    cm3: ['cm3', 'cubiccm', 'cubiccentimetre', 'cubiccentimetres', 'cubiccentimeter', 'cubiccentimeters', 'cc'],
    m3: ['m3', 'cubicm', 'cubicmetre', 'cubicmetres', 'cubicmeter', 'cubicmeters'],
    deg: ['°', 'deg', 'degree', 'degrees'],
    degC: ['°c', 'c', '°', 'degreescelsius', 'degrees', 'degree', 'deg'],
    dollar: ['$', 'dollar', 'dollars', 'cad'],
    usd: ['usd', '$', 'dollar', 'dollars', 'us$', 'usdollars'],
    eur: ['eur', 'euro', 'euros', '€'],
    kmh: ['km/h', 'kmh', 'km/hr', 'kph', 'kmperhour'],
    perMin: ['/min', 'permin', 'perminute', 'wpm', 'words/min', 'wordsperminute', 'wordsmin'],
    weeks: ['week', 'weeks', 'wk', 'wks'],
    months: ['month', 'months', 'mo'],
    percent: ['%', 'percent']
  };
  function units(...keys) {
    const out = [];
    keys.forEach(k => (UNIT_ALIASES[k] || [k]).forEach(u => out.push(normUnit(u))));
    return out;
  }

  // ---------- answer parsing ----------
  function parseNumber(raw, allowedUnits) {
    const s = String(raw).trim().replace(/[−–]/g, '-').replace(/^[a-zA-Z]\s*=\s*/, '').replace(/^\$\s*/, '');
    const m = s.match(/^(-?\d[\d,\s ]*(?:\.\d+)?|-?\.\d+)\s*(.*)$/);
    if (!m) return null;
    const num = Number(m[1].replace(/[,\s ]/g, ''));
    if (Number.isNaN(num)) return null;
    const u = normUnit(m[2]);
    if (u !== '' && u !== '%' && !(allowedUnits || []).includes(u)) return null;
    return num;
  }

  function parseFraction(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-');
    let m = s.match(/^(-?)\s*(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (m) {
      const d = +m[4];
      if (!d) return null;
      const n = (+m[2]) * d + (+m[3]);
      return { n: m[1] === '-' ? -n : n, d };
    }
    m = s.match(/^(-?\d+)\s*[\/:]\s*(-?\d+)$/);
    if (m) {
      let n = +m[1], d = +m[2];
      if (!d) return null;
      if (d < 0) { n = -n; d = -d; }
      return { n, d };
    }
    if (/^-?\d+$/.test(s)) return { n: +s, d: 1 };
    return null;
  }

  function parseRational(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-');
    const f = parseFraction(s);
    if (f) return { kind: /[\/:]/.test(s) ? 'frac' : 'int', value: f.n / f.d };
    const pm = s.match(/^(-?\d*\.?\d+)\s*%$/);
    if (pm) return { kind: 'pct', value: Number(pm[1]) };
    if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return { kind: 'dec', value: Number(s) };
    return null;
  }

  function normText(s) {
    let t = String(s).toLowerCase();
    t = t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => '^' + SUPDIGITS.indexOf(c));
    t = t.replace(/\*\*/g, '^').replace(/[−–]/g, '-');
    return t.replace(/[\s*×·.'"`]/g, '').replace(/-/g, '');
  }

  function parseList(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-').replace(/[(){}\[\]]/g, '');
    const parts = s.split(/[\s,;×x*]+/).filter(p => p !== '');
    const nums = parts.map(Number);
    return nums.some(Number.isNaN) ? null : nums;
  }

  function parsePoint(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-');
    const m = s.match(/^\(?\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*\)?$/);
    return m ? { x: Number(m[1]), y: Number(m[2]) } : null;
  }

  function checkAnswer(problem, raw) {
    if (raw === null || raw === undefined || String(raw).trim() === '') return false;
    const c = problem.correct;
    switch (problem.answerType) {
      case 'number': {
        const v = parseNumber(raw, problem.units);
        return v !== null && Math.abs(v - c.value) <= c.tolerance + 1e-12;
      }
      case 'fraction': {
        const p = parseFraction(raw);
        if (!p || p.n * c.d !== c.n * p.d) return false;
        return !c.requireLowest || gcd(p.n, p.d) === 1;
      }
      case 'ratio': {
        const p = parseFraction(raw);
        return !!p && /[\/:]/.test(String(raw)) && p.n * c.d === c.n * p.d;
      }
      case 'rational': {
        const p = parseRational(raw);
        if (!p) return false;
        if (p.kind === 'pct') return Math.abs(p.value - c.value * 100) <= (c.tolPct === undefined ? 1e-7 : c.tolPct);
        if (p.kind === 'dec') return Math.abs(p.value - c.value) <= (c.tol === undefined ? 1e-9 : c.tol);
        return Math.abs(p.value - c.value) <= 1e-9;
      }
      case 'sequence': {
        let got = parseList(raw);
        if (!got || got.length !== c.sequence.length) return false;
        let want = c.sequence;
        if (c.unordered) { got = got.slice().sort((a, b) => a - b); want = want.slice().sort((a, b) => a - b); }
        return got.every((v, i) => Math.abs(v - want[i]) < 1e-9);
      }
      case 'rationalSequence': {
        const parts = String(raw).split(/[;,]\s*/).filter(p => p.trim() !== '');
        if (parts.length !== c.values.length) return false;
        const vals = parts.map(p => parseRational(p));
        if (vals.some(v => v === null || v.kind === 'pct')) return false;
        return vals.every((v, i) => Math.abs(v.value - c.values[i]) < 1e-9);
      }
      case 'text': {
        const t = normText(raw);
        return c.accepted.some(a => normText(a) === t);
      }
      case 'point': {
        const p = parsePoint(raw);
        return !!p && Math.abs(p.x - c.x) < 1e-9 && Math.abs(p.y - c.y) < 1e-9;
      }
    }
    return false;
  }

  // ---------- visuals (inline SVG / HTML) ----------
  const COLORS = ['#4f6df5', '#17a673', '#e5484d', '#f5a623', '#8e5cf7', '#0fb5ba', '#d6409f', '#7a8499'];
  function niceStep(max, targetLines) {
    for (const s of [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000]) if (max / s <= (targetLines || 6)) return s;
    return 1000;
  }
  function chartFrame(W, H, L, R, T, B, top, step, title, yTitle) {
    const plotH = H - T - B;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">`;
    s += `<text x="${W / 2}" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">${escapeHtml(title || '')}</text>`;
    for (let v = 0; v <= top + 1e-9; v += step) {
      const y = T + plotH - (v / top) * plotH;
      s += `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="#e2e8f2" />`;
      s += `<text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6b7488">${n2s(v)}</text>`;

    if (yTitle) s += `<text transform="translate(12 ${T + plotH / 2}) rotate(-90)" text-anchor="middle" font-size="11" fill="#6b7488">${escapeHtml(yTitle)}</text>`;

  function svgBar(labels, values, o = {}) {

      s += `<text x="${L + i * slot + slot / 2}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="#1a2332">${escapeHtml(labels[i])}</text>`;

  function svgPie(labels, pcts, o = {}) {

  const GENERATORS = {};

  function ordinal(n) {

  // =====================================================================
  // NUMBER: integers  (Gr 6: B1.2, B1.3 read/compare/order integers;

  function intsCompare() {
    const a = randInt(-20, 20);
    let b = randInt(-20, 20);
    while (b === a) b = randInt(-20, 20);
    const greater = Math.random() < 0.5;
    const ans = greater ? Math.max(a, b) : Math.min(a, b);
    return makeNum('integers', `Which is ${greater ? 'greater' : 'less'}: ${fmtSigned(a)} or ${fmtSigned(b)}?`, ans,

      { hint: 'Enter the number itself.' });
  }
  function intsOrder() {
    const nums = new Set();
    while (nums.size < 4) nums.add(randInt(-20, 20));
    const list = shuffle([...nums]);
    const sorted = [...list].sort((x, y) => x - y);
    return makeSeq('integers', `Order from least to greatest: ${list.join(', ')}`, sorted,

      { hint: 'Enter the numbers separated by commas, e.g. -3, 0, 5.' });
  }
  function intsOpposite() {

  function intsAddSub7() {

  // =====================================================================
  // NUMBER: number sense  (Gr 6: B1.1, B1.3-B1.6; Gr 7: B1.1-B1.7, B2.2)
  // =====================================================================
  const PLACE_NAMES = ['whole number', 'tenth', 'hundredth'];
  function roundDecimal() {
    const target = randInt(0, 2);
    const td = target === 2 ? 3 : randInt(target + 1, 3);
    const whole = randInt(0, 99);
    const F = randInt(0, Math.pow(10, td) - 1);
    const scale = Math.pow(10, td);
    const N = whole * scale + F;
    const div = Math.pow(10, td - target);
    let q = Math.floor(N / div);
    const r = N % div;
    const digit = Math.floor((r * 10) / div);
    if (2 * r >= div) q += 1;
    const result = q / Math.pow(10, target);
    const x = (N / scale).toFixed(td);
    return makeNum('numbersense', `Round ${x} to the nearest ${PLACE_NAMES[target]}.`, result,
      `Look at the digit just to the right of the ${PLACE_NAMES[target]} place: it is ${digit}. ${digit >= 5 ? 'Since it is 5 or more, round up' : 'Since it is less than 5, round down'}: ${result.toFixed(target)}.`,
      { display: result.toFixed(target), tol: 1e-9, hint: 'Enter the rounded number.' });
  }
  function roundRepeating6() {
    const d = pick([3, 6, 7, 9, 11]);
    let n = randInt(1, d - 1);
    if (d === 6 && n === 3) n = pick([1, 2, 4, 5]);
    const target = pick([1, 2]);
    const v = n / d;
    const result = Math.round(v * Math.pow(10, target)) / Math.pow(10, target);
    return makeNum('numbersense', `Write ${n}/${d} as a decimal and round it to the nearest ${PLACE_NAMES[target]}.`, result,
      `${n} ÷ ${d} = ${v.toFixed(6)}… (repeating). Rounded to the nearest ${PLACE_NAMES[target]}: ${result.toFixed(target)}.`,
      { display: result.toFixed(target), tol: 1e-9 });
  }
  function compareDecimals6() {
    const w = randInt(0, 9);
    const a = w + randInt(100, 999) / 1000;
    const delta = pick([0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1]);
    const b = r6(a + (Math.random() < 0.5 ? delta : -delta));
    if (b <= w) return compareDecimals6();
    const greater = Math.random() < 0.5;
    const ans = greater ? Math.max(a, b) : Math.min(a, b);
    return makeNum('numbersense', `Which is ${greater ? 'greater' : 'less'}: ${a.toFixed(3)} or ${n2s(b)}?`, ans,
      `Compare place by place from the left. The first place where they differ decides it: ${n2s(ans)} is ${greater ? 'greater' : 'less'}.`,
      { tol: 1e-9, hint: 'Enter the number itself.' });
  }
  function randFracRep(allowImproper) {
    const d = pick([2, 3, 4, 5, 6, 8, 10, 12]);
    const n = allowImproper && Math.random() < 0.3 ? randInt(d + 1, 2 * d - 1) : randInt(1, d - 1);
    return { text: `${n}/${d}`, value: n / d };
  }
  function randDecRep() {
    const dp = pick([1, 2]);
    const v = randInt(1, 15 * Math.pow(10, dp - 1)) / Math.pow(10, dp);
    return { text: v.toFixed(dp).replace(/0+$/, '').replace(/\.$/, ''), value: v };
  }
  function compareFracDec() {
    for (let i = 0; i < 100; i++) {
      const f = randFracRep(false), dcm = randDecRep();
      if (dcm.value >= 1.5 || Math.abs(f.value - dcm.value) < 0.02) continue;
      const greater = Math.random() < 0.5;
      const pickF = greater ? f.value > dcm.value : f.value < dcm.value;
      const chosen = pickF ? f : dcm;
      return makeRat('numbersense', `Which is ${greater ? 'greater' : 'less'}: ${f.text} or ${dcm.text}?`, chosen.value,
        `Write both as decimals: ${f.text} = ${n2s(f.value)} and ${dcm.text} = ${dcm.text}. ${chosen.text} is ${greater ? 'greater' : 'less'}.`,
        { display: chosen.text, hint: 'Enter the number itself (as a fraction or a decimal).' });
    }
    return compareFracDec();
  }
  function orderMixedList(grade) {
    for (let i = 0; i < 200; i++) {
      const reps = [];
      const kinds = grade === 6 ? ['frac', 'dec', 'dec', 'int'] : ['frac', 'frac', 'dec', 'dec'];
      for (const k of shuffle(kinds)) {
        let rep;
        if (k === 'frac') rep = randFracRep(grade === 6);
        else if (k === 'dec') rep = randDecRep();
        else rep = { text: String(randInt(-5, 3)), value: 0 };
        if (k === 'int') rep.value = Number(rep.text);
        if (grade === 7 && Math.random() < 0.6) {
          rep = { text: '-' + rep.text, value: -rep.value };
        }
        reps.push(rep);
      }

    const r = pick([5, 10, 15]), L = randInt(1, 10) * 20;
    return makeNum('financial', `A lender charges a ${r}% fee on the amount borrowed. How much is the fee on a $${L} loan?`, L * r / 100,
      `${r}% of ${L} = ${r}/100 × ${L} = $${n2s(L * r / 100)}.`, { units: units('dollar'), display: '$' + n2s(L * r / 100), hint: 'Enter an amount in dollars.' });
  }
  function budget6() {
    const nm = pick(NAMES), income = randInt(4, 12) * 10, a = randInt(5, 20), b = randInt(5, 15), w = randInt(2, 8);
    if (income - a - b <= 0) return budget6();
    return makeNum('financial', `${nm} earns $${income} each week. Each week ${nm} spends $${a} on food and $${b} on transit and saves the rest. How much does ${nm} save in ${w} weeks?`, (income - a - b) * w,
      `Savings per week: ${income} − ${a} − ${b} = ${income - a - b}. In ${w} weeks: ${income - a - b} × ${w} = $${(income - a - b) * w}.`, { units: units('dollar'), display: `$${(income - a - b) * w}`, hint: 'Enter an amount in dollars.' });
  }
  function currency7() {
    const amt = randInt(5, 50) * 10;
    const t = randInt(1, 4);
    if (t === 1) {
      const rate = pick([0.72, 0.73, 0.74, 0.75, 0.76]);
      return makeNum('financial', `Suppose the exchange rate is 1 CAD = ${rate.toFixed(2)} USD. How many US dollars is $${amt} CAD worth?`, r6(amt * rate),
        `Multiply by the exchange rate: ${amt} × ${rate.toFixed(2)} = ${n2s(amt * rate)} USD.`, { units: units('usd'), display: `${n2s(amt * rate)} USD`, hint: 'Enter an amount in US dollars.' });
    }
    if (t === 2) {
      const rate = pick([1.30, 1.35, 1.40, 1.45]);
      return makeNum('financial', `Suppose the exchange rate is 1 USD = ${rate.toFixed(2)} CAD. How many Canadian dollars is $${amt} USD worth?`, r6(amt * rate),
        `Multiply by the exchange rate: ${amt} × ${rate.toFixed(2)} = ${n2s(amt * rate)} CAD.`, { units: units('dollar'), display: `${n2s(amt * rate)} CAD`, hint: 'Enter an amount in Canadian dollars.' });
    }
    if (t === 3) {
      const rate = pick([0.65, 0.66, 0.68, 0.70]);
      return makeNum('financial', `Suppose the exchange rate is 1 CAD = ${rate.toFixed(2)} euros. How many euros do you get for $${amt} CAD?`, r6(amt * rate),
        `${amt} × ${rate.toFixed(2)} = ${n2s(amt * rate)} euros.`, { units: units('eur'), display: `${n2s(amt * rate)} euros`, hint: 'Enter an amount in euros.' });
    }
    const rate = pick([1.40, 1.45, 1.50, 1.55]);
    const cost = randInt(5, 40) * 5;
    return makeNum('financial', `A souvenir costs ${cost} euros. The exchange rate is 1 euro = ${rate.toFixed(2)} CAD. What is the cost in Canadian dollars?`, r6(cost * rate),
      `${cost} × ${rate.toFixed(2)} = ${n2s(cost * rate)} CAD.`, { units: units('dollar'), display: '$' + n2s(cost * rate), hint: 'Enter an amount in Canadian dollars.' });
  }
  function interestCompare7() {
    for (let i = 0; i < 100; i++) {
      const r1 = randInt(2, 8) / 2, r2 = randInt(2, 8) / 2, P1 = randInt(2, 10) * 100, P2 = randInt(2, 10) * 100;
      const i1 = r6(P1 * r1 / 100), i2 = r6(P2 * r2 / 100);
      if (i1 === i2) continue;
      const best = Math.max(i1, i2);
      return makeNum('financial', `Account A pays ${n2s(r1)}% interest per year on $${P1}. Account B pays ${n2s(r2)}% interest per year on $${P2}. How much interest does the better account earn in one year?`, best,
        `Account A: ${n2s(r1)}% of ${P1} = $${n2s(i1)}. Account B: ${n2s(r2)}% of ${P2} = $${n2s(i2)}. The better account earns $${n2s(best)}.`, { units: units('dollar'), display: '$' + n2s(best), hint: 'Enter an amount in dollars.' });
    }
    return interestCompare7();
  }
  function budget7() {
    const nm = pick(NAMES), income = randInt(10, 40) * 100;
    for (let i = 0; i < 100; i++) {
      const p1 = randInt(4, 8) * 5, p2 = randInt(2, 5) * 5, p3 = randInt(2, 5) * 5;
      if (p1 + p2 + p3 >= 95) continue;
      const t = randInt(1, 3);
      if (t === 1) return makeNum('financial', `${nm}'s monthly income is $${income}. A budget sets aside ${p1}% for rent. How much is set aside for rent?`, income * p1 / 100,
        `${p1}% of ${income} = ${p1}/100 × ${income} = $${n2s(income * p1 / 100)}.`, { units: units('dollar'), display: '$' + n2s(income * p1 / 100), hint: 'Enter an amount in dollars.' });
      if (t === 2) {
        const left = 100 - p1 - p2 - p3;
        return makeNum('financial', `${nm}'s monthly income is $${income}. The budget sets aside ${p1}% for rent, ${p2}% for food and ${p3}% for savings. How much money is left for other expenses?`, income * left / 100,
          `Percent left over: 100 − ${p1} − ${p2} − ${p3} = ${left}%. ${left}% of ${income} = $${n2s(income * left / 100)}.`, { units: units('dollar'), display: '$' + n2s(income * left / 100), hint: 'Enter an amount in dollars.' });
      }
      const monthly = income * p3 / 100, months = randInt(3, 12);
      return makeNum('financial', `${nm}'s monthly income is $${income} and ${p3}% of it goes to savings. How many months will it take to save $${monthly * months}?`, months,
        `Savings per month: ${p3}% of ${income} = $${n2s(monthly)}. Months = ${monthly * months} ÷ ${n2s(monthly)} = ${months}.`, { units: units('months'), display: `${months} months`, hint: 'Enter a number of months.' });
    }
    return budget7();
  }
  GENERATORS.financial = {
    6: [savingsGoal6, savingsGoal6, interest6, interest6, budget6],
    7: [currency7, currency7, currency7, interestCompare7, budget7, budget7]
  };

  function generateProblem(topicId, grade) {
    const actual = topicId === 'mixed' ? pick(PRACTICE_TOPIC_IDS) : topicId;
    const p = pick(GENERATORS[actual][grade])();
    p.topicId = actual;
    return p;
  }

  // ---------- state ----------
  const MAX_QUESTIONS_PER_TOPIC = 5;
  const GRADE_KEY = 'mathPractice67_grade_v1';

  let stats = loadStats() || { correct: 0, total: 0, streak: 0 };
  let selectedGrade = loadGrade();
  let currentProblem = null;
  let answered = false;
  let session = null; // { topicId, index, correct, history }

  function loadStats() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (typeof parsed !== 'object' || parsed === null) return null;
      return { correct: parsed.correct || 0, total: parsed.total || 0, streak: parsed.streak || 0 };
    } catch (e) {
      return null;
    }
  }
  function saveStats() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch (e) {}
  }
  function loadGrade() {
    try {
      const raw = localStorage.getItem(GRADE_KEY);
      return raw === '6' || raw === '7' ? Number(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function saveGrade() {
    try { localStorage.setItem(GRADE_KEY, String(selectedGrade)); } catch (e) {}
  }

  // ---------- DOM ----------
  const gradeGate = document.getElementById('gradeGate');
  const mainArea = document.getElementById('mainArea');
  const currentGradeLabel = document.getElementById('currentGradeLabel');
  const changeGradeBtn = document.getElementById('changeGradeBtn');
  const topicButtons = document.getElementById('topicButtons');
  const scoreNum = document.getElementById('scoreNum');
  const streakNum = document.getElementById('streakNum');
  const accuracyNum = document.getElementById('accuracyNum');
  const resetBtn = document.getElementById('resetBtn');
  const emptyState = document.getElementById('emptyState');
  const problemArea = document.getElementById('problemArea');
  const summaryArea = document.getElementById('summaryArea');
  const summaryScore = document.getElementById('summaryScore');
  const summaryLabel = document.getElementById('summaryLabel');
  const practiceAgainBtn = document.getElementById('practiceAgainBtn');
  const topicTag = document.getElementById('topicTag');
  const progressTag = document.getElementById('progressTag');
  const questionText = document.getElementById('questionText');
  const questionVisual = document.getElementById('questionVisual');
  const answerHint = document.getElementById('answerHint');
  const answerInput = document.getElementById('answerInput');
  const actionBtn = document.getElementById('actionBtn');
  const feedback = document.getElementById('feedback');
  const feedbackHeadline = document.getElementById('feedbackHeadline');
  const feedbackSolution = document.getElementById('feedbackSolution');

  document.querySelectorAll('.grade-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedGrade = Number(btn.dataset.grade);
      saveGrade();
      enterMainArea();
    });
  });
  changeGradeBtn.addEventListener('click', () => {
    mainArea.style.display = 'none';
    gradeGate.style.display = 'block';
    session = null;
    currentProblem = null;
    emptyState.style.display = 'block';
    problemArea.style.display = 'none';
    summaryArea.style.display = 'none';
    topicButtons.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  });

  function enterMainArea() {
    gradeGate.style.display = 'none';
    mainArea.style.display = 'block';
    currentGradeLabel.textContent = `Grade ${selectedGrade}`;
  }
  if (selectedGrade) enterMainArea();

  function topicButtonHtml(t) {
    return `<button type="button" class="topic-btn" data-topic="${t.id}">${escapeHtml(t.label)}</button>`;
  }
  (function buildTopicButtons() {
    const strands = [];
    TOPICS.filter(t => t.strand).forEach(t => { if (!strands.includes(t.strand)) strands.push(t.strand); });
    let html = `<div class="topic-group"><div class="topic-group-buttons">${topicButtonHtml(TOPICS[0])}</div></div>`;
    strands.forEach(s => {
      html += `<div class="topic-group"><div class="topic-group-label">${escapeHtml(s)}</div><div class="topic-group-buttons">` +
        TOPICS.filter(t => t.strand === s).map(topicButtonHtml).join('') + '</div></div>';
    });
    topicButtons.innerHTML = html;
  })();
  topicButtons.querySelectorAll('.topic-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      topicButtons.querySelectorAll('.topic-btn').forEach(b => b.classList.toggle('active', b === btn));
      startSession(btn.dataset.topic);
    });
  });

  resetBtn.addEventListener('click', () => {
    stats = { correct: 0, total: 0, streak: 0 };
    saveStats();
    renderStats();

    session = null;
    currentProblem = null;
    answered = false;
    topicButtons.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
    problemArea.style.display = 'none';
    summaryArea.style.display = 'none';
    emptyState.style.display = 'block';
  });

  actionBtn.addEventListener('click', () => {
    if (!answered) {
      if (answerInput.value.trim() === '') return;
      submitAnswer();
    } else {
      advance();
    }
  });
  answerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (!answered) {
        if (answerInput.value.trim() === '') return;
        submitAnswer();
      } else {
        advance();
      }
    }
  });
  answerInput.addEventListener('input', () => {
    if (!answered) actionBtn.disabled = answerInput.value.trim() === '';
  });
  practiceAgainBtn.addEventListener('click', () => {
    const topicId = session.topicId;
    stats = { correct: 0, total: 0, streak: 0 };
    saveStats();
    renderStats();
    startSession(topicId);
  });

  function renderStats() {
    scoreNum.textContent = `${stats.correct} / ${stats.total}`;
    streakNum.textContent = `${stats.streak}`;
    accuracyNum.textContent = stats.total > 0 ? `${Math.round((stats.correct / stats.total) * 100)}%` : '—';
  }

  function startSession(topicId) {
    session = { topicId, index: 0, correct: 0, history: [] };
    summaryArea.style.display = 'none';
    advance();
  }

  function advance() {
    if (!session) return;
    if (session.index >= MAX_QUESTIONS_PER_TOPIC) {
      showSummary();
      return;
    }
    session.index += 1;
    currentProblem = generateProblem(session.topicId, selectedGrade);
    answered = false;
    emptyState.style.display = 'none';
    problemArea.style.display = 'block';
    summaryArea.style.display = 'none';
    topicTag.textContent = TOPIC_LABEL[currentProblem.topicId];
    progressTag.textContent = `Question ${session.index} of ${MAX_QUESTIONS_PER_TOPIC}`;
    questionText.textContent = currentProblem.question;
    if (currentProblem.visual) {
      questionVisual.innerHTML = currentProblem.visual;
      questionVisual.style.display = 'block';
    } else {
      questionVisual.innerHTML = '';
      questionVisual.style.display = 'none';
    }
    answerHint.textContent = currentProblem.hint;
    answerInput.value = '';
    answerInput.disabled = false;
    answerInput.focus();
    actionBtn.textContent = 'Check';
    actionBtn.classList.remove('next');
    actionBtn.disabled = true;
    feedback.className = 'feedback';
    feedback.style.display = 'none';
  }

  function showSummary() {
    problemArea.style.display = 'none';
    summaryArea.style.display = 'block';
    summaryScore.textContent = `${session.correct} / ${MAX_QUESTIONS_PER_TOPIC}`;
    summaryLabel.textContent = `${TOPIC_LABEL[session.topicId]} — nice work!`;

    const wrongCount = session.history.length - session.correct;
    document.getElementById('summaryCorrectCount').textContent = session.correct;
    document.getElementById('summaryWrongCount').textContent = wrongCount;

    const reviewList = document.getElementById('reviewList');
    reviewList.innerHTML = session.history.map((h, idx) => `
      <div class="review-item ${h.isCorrect ? 'item-correct' : 'item-wrong'}">
        <div class="review-item-head">
          <span class="review-item-num">Question ${idx + 1}${session.topicId === 'mixed' ? ' · ' + escapeHtml(h.topicLabel) : ''}</span>
          <span class="review-badge ${h.isCorrect ? 'correct' : 'wrong'}">${h.isCorrect ? 'Correct' : 'Wrong'}</span>
        </div>
        <div class="review-question">${escapeHtml(h.question)}</div>
        ${h.visual ? `<div class="visual">${h.visual}</div>` : ''}
        <div class="review-answer-line ${h.isCorrect ? 'correct-value' : 'wrong-value'}">Your answer: <b>${escapeHtml(h.userAnswer)}</b></div>
        ${h.isCorrect ? '' : `<div class="review-answer-line correct-value">Correct answer: <b>${escapeHtml(h.correctDisplay)}</b></div>`}
        <div class="review-steps"><span class="steps-label">Steps:</span>${escapeHtml(h.solution)}</div>
      </div>
    `).join('');
  }

  function submitAnswer() {
    if (!currentProblem || answered) return;
    const raw = answerInput.value;
    const isCorrect = checkAnswer(currentProblem, raw);

    stats.total += 1;
    if (isCorrect) {
      stats.correct += 1;
      stats.streak += 1;
      session.correct += 1;
    } else {
      stats.streak = 0;
    }
    saveStats();
    renderStats();

    session.history.push({
      question: currentProblem.question,
      visual: currentProblem.visual || '',
      topicLabel: TOPIC_LABEL[currentProblem.topicId],
      userAnswer: raw,
      isCorrect,
      correctDisplay: currentProblem.correctDisplay,
      solution: currentProblem.solution
    });

    answered = true;
    answerInput.disabled = true;
    actionBtn.disabled = false;
    actionBtn.textContent = session.index >= MAX_QUESTIONS_PER_TOPIC ? 'See results' : 'Next question';
    actionBtn.classList.add('next');

    feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
    feedback.style.display = 'block';
    feedbackHeadline.textContent = isCorrect
      ? 'Correct!'
      : `Not quite — the answer is ${currentProblem.correctDisplay}`;
    feedbackSolution.textContent = currentProblem.solution;

    actionBtn.focus();
  }


  renderStats();
})();
</script>
</body>
</html>
