      for (;;) {
        const n = randInt(2, 5), list = Array.from({ length: n }, () => pick([5, 10, 25])), sum = list.reduce((s, x) => s + x, 0);
        if (sum > 50) continue;
        return makeNum('financial', 'How much money is shown, in cents?', sum, `Add the coins: ${list.join(' + ')} = ${sum}¢.`, { visual: svgMoney(list.map(c => COIN_ITEMS[c])), units: units('cents'), hint: 'Enter a number of cents.' });
      }
    }
    const n = randInt(2, 3), list = Array.from({ length: n }, () => pick([5, 10, 20, 50]) * 100), sum = list.reduce((s, x) => s + x, 0);
    if (sum > 5000) return coinsShown1();
    return makeNum('financial', 'How much money is shown, in dollars?', sum / 100, `Add the bills: ${list.map(x => '$' + x / 100).join(' + ')} = $${sum / 100}.`, { visual: svgMoney(list.map(c => COIN_ITEMS[c])), units: units('dollar'), hint: 'Enter an amount in dollars.' });
  }
  function coinsText1() {
    const d = randInt(1, 3), n = randInt(1, 4), q = Math.random() < 0.3 ? 1 : 0, total = d * 10 + n * 5 + q * 25;
    if (total > 50) return coinsText1();
    return makeNum('financial', `What is the value of ${pv(d, 'dime')}${q ? ', 1 quarter' : ''} and ${pv(n, 'nickel')}, in cents?`, total, `A dime is 10¢, a nickel is 5¢${q ? ' and a quarter is 25¢' : ''}. ${d} × 10 + ${n} × 5${q ? ' + 25' : ''} = ${total}¢.`, { units: units('cents'), hint: 'Enter a number of cents.' });
  }
  function compareMoney1() {
    const opts = [['3 nickels', 15, '1 dime', 10], ['2 dimes', 20, '1 quarter', 25], ['5 nickels', 25, '2 dimes', 20], ['1 quarter', 25, '3 dimes', 30], ['4 nickels', 20, '1 quarter', 25], ['2 nickels', 10, '1 dime', 10], ['a $5 bill', 500, 'a $10 bill', 1000]];
    const [a, va, b, vb] = pick(opts.filter(o => o[1] !== o[3])), ans = va > vb ? 'A' : 'B';
    return makeText('financial', `A: ${a}   B: ${b}. Which is worth more? Type A or B.`, [ans.toLowerCase()], ans, `A is worth ${va >= 500 ? '$' + va / 100 : va + '¢'} and B is worth ${vb >= 500 ? '$' + vb / 100 : vb + '¢'}, so ${ans} is worth more.`, { hint: 'Type A or B.' });
  }
  function coins2() {
    const t = randInt(1, 4);
    if (t === 1) {
      const q = randInt(0, 4), d = randInt(0, 4), n = randInt(0, 4), total = q * 25 + d * 10 + n * 5;
      if (total === 0 || q + d + n < 3) return coins2();
      const parts = [q && pv(q, 'quarter'), d && pv(d, 'dime'), n && pv(n, 'nickel')].filter(Boolean);
      return makeNum('financial', `${pick(NAMES)} has ${parts.join(', ').replace(/, ([^,]*)$/, ' and $1')}. How many cents is that?`, total, `${q ? q + ' × 25 + ' : ''}${d ? d + ' × 10 + ' : ''}${n ? n + ' × 5 + ' : ''}`.replace(/ \+ $/, '') + ` = ${total}¢.`, { units: units('cents'), hint: 'Enter a number of cents.' });
    }
    if (t === 2) {
      const q = randInt(1, 4), d = randInt(1, 3), n = randInt(1, 3), total = q * 25 + d * 10 + n * 5;
      return makeNum('financial', `${total}¢ = ${pv(q, 'quarter')} + ${pv(d, 'dime')} + ? ${'nickels'}`, n, `${q} × 25 = ${q * 25} and ${d} × 10 = ${d * 10}, so ${total} − ${q * 25 + d * 10} = ${n * 5} is left. ${n * 5} ÷ 5 = ${n} nickels.`, { hint: 'Enter the missing number of nickels.' });
    }
    if (t === 3) {
      const k = randInt(2, 9), toonie = Math.random() < 0.5;
      return makeNum('financial', `How many ${toonie ? '$2 coins (toonies)' : '$5 bills'} make $${k * (toonie ? 2 : 5)}?`, k, `$${k * (toonie ? 2 : 5)} ÷ $${toonie ? 2 : 5} = ${k}.`, { hint: 'Enter a number.' });
    }
    const list = shuffle([pick([100, 200]), pick([100, 200]), pick([500, 1000]), pick([500, 1000, 2000])]), sum = list.reduce((s, x) => s + x, 0);
    return makeNum('financial', 'How much money is shown, in dollars?', sum / 100, `Add: ${list.map(x => '$' + x / 100).join(' + ')} = $${sum / 100}.`, { visual: svgMoney(list.map(c => COIN_ITEMS[c])), units: units('dollar'), hint: 'Enter an amount in dollars.' });
  }
  function change3() {
    const nm = pick(NAMES);
    if (Math.random() < 0.5) {
      const p = randInt(1, 19) * 5;
      return makeNum('financial', `${nm} buys a sticker for ${p}¢ and pays with $1. How much change should ${nm} get, in cents?`, 100 - p, `$1 = 100¢. 100 − ${p} = ${100 - p}¢.`, { units: units('cents'), hint: 'Enter a number of cents.' });
    }
    const pay = pick([5, 10, 20]), p = randInt(1, pay - 1);
    return makeNum('financial', `${nm} buys a toy for $${p} and pays with a $${pay} bill. How much change should ${nm} get, in dollars?`, pay - p, `${pay} − ${p} = ${pay - p}, so the change is $${pay - p}.`, { units: units('dollar'), hint: 'Enter an amount in dollars.' });
  }
  function cost4() {
    const nm = pick(NAMES), t = randInt(1, 3);
    if (t === 1) {
      const n = randInt(3, 4), prices = Array.from({ length: n }, () => randInt(2, 15)), total = prices.reduce((s, x) => s + x, 0);
      return makeNum('financial', `${nm} buys items that cost ${prices.map(p => '$' + p).join(', ').replace(/, ([^,]*)$/, ' and $1')}. What is the total cost, in dollars?`, total, `Add the prices: ${prices.join(' + ')} = ${total}.`, { units: units('dollar'), hint: 'Enter an amount in dollars.' });
    }
    if (t === 2) {
      const prices = [randInt(2, 15), randInt(2, 15), randInt(2, 12)], total = prices.reduce((s, x) => s + x, 0), pay = total <= 20 ? 20 : 50;
      return makeNum('financial', `${nm} buys items that cost $${prices[0]}, $${prices[1]} and $${prices[2]} and pays with $${pay}. How much change should ${nm} get, in dollars?`, pay - total, `Total: ${prices.join(' + ')} = ${total}. Change: ${pay} − ${total} = ${pay - total}.`, { units: units('dollar'), hint: 'Enter an amount in dollars.' });
    }
    const w = randInt(2, 10) * 2, k = randInt(2, 8);
    return makeNum('financial', `${nm} earns $${w} each week and saves half of it. How much does ${nm} save in ${k} weeks, in dollars?`, w / 2 * k, `Half of $${w} is $${w / 2} each week. ${k} × ${w / 2} = ${w / 2 * k}.`, { units: units('dollar'), hint: 'Enter an amount in dollars.' });
  }
  function tax5() {
    const p = randInt(2, 60), nm = pick(NAMES);
    if (Math.random() < 0.5) return makeNum('financial', `A game costs $${p} before tax. The sales tax is 13%. How much is the tax, in dollars?`, r6(p * 0.13), `13% of ${p} = ${p} × 0.13 = ${n2s(r6(p * 0.13))}.`, { units: units('dollar'), tol: 0.005, hint: 'Enter an amount in dollars.' });
    return makeNum('financial', `A game costs $${p} before tax. The sales tax is 13%. What is the total cost, in dollars?`, r6(p * 1.13), `Tax: ${p} × 0.13 = ${n2s(r6(p * 0.13))}. Total: ${p} + ${n2s(r6(p * 0.13))} = ${n2s(r6(p * 1.13))}.`, { units: units('dollar'), tol: 0.005, hint: 'Enter an amount in dollars.' });
  }
  function budget5() {
    const nm = pick(NAMES), income = randInt(4, 12) * 100, items = [['rent', randInt(1, 4) * 100], ['food', randInt(1, 2) * 100], ['transportation', randInt(1, 3) * 50]];
    const spend = items.reduce((s, x) => s + x[1], 0);
    if (spend >= income) return budget5();
    return makeNum('financial', `${nm} earns $${income} each month. ${nm} spends ${items.map(x => `$${x[1]} on ${x[0]}`).join(', ').replace(/, ([^,]*)$/, ' and $1')}. How much money is left to save?`, income - spend, `Spending: ${items.map(x => x[1]).join(' + ')} = ${spend}. Left over: ${income} − ${spend} = ${income - spend}.`, { units: units('dollar'), hint: 'Enter an amount in dollars.' });
  }
  function unitRate5() {
    const n = pick([2, 3, 4, 5, 6, 8, 10, 12]), u = randInt(25, 400) / 100, total = r6(u * n), itemPair = pick([['muffin', 'muffins'], ['juice box', 'juice boxes'], ['pencil', 'pencils'], ['banana', 'bananas']]), item = itemPair[0];
    return makeNum('financial', `${n} ${itemPair[1]} cost $${total.toFixed(2)}. What is the cost of 1 ${item}, in dollars?`, u, `Divide the total by ${n}: ${total.toFixed(2)} ÷ ${n} = ${u.toFixed(2)}.`, { units: units('dollar'), tol: 0.005, display: u.toFixed(2), hint: 'Enter an amount in dollars.' });
  }
  function bestValue5() {
    for (;;) {
      const n1 = pick([2, 3, 4, 5, 6]), n2 = pick([6, 8, 10, 12]), u1 = randInt(50, 200) / 100, u2 = randInt(50, 200) / 100, t1 = r6(u1 * n1), t2 = r6(u2 * n2);
      if (Math.abs(u1 - u2) < 0.1) continue;
      const ans = u1 < u2 ? 'A' : 'B';
      return makeText('financial', `Pack A has ${n1} granola bars for $${t1.toFixed(2)}. Pack B has ${n2} granola bars for $${t2.toFixed(2)}. Which pack costs less per bar? Type A or B.`, [ans.toLowerCase(), 'pack ' + ans.toLowerCase()], ans,
        `Pack A: ${t1.toFixed(2)} ÷ ${n1} = $${u1.toFixed(2)} per bar. Pack B: ${t2.toFixed(2)} ÷ ${n2} = $${u2.toFixed(2)} per bar. Pack ${ans} costs less per bar.`, { hint: 'Type A or B.' });
    }
  }

  // ---------- registry (Spatial, Financial) ----------
  GENERATORS.geometry[1] = [shapeSides.bind(null, 1), shapeSides.bind(null, 1), shapeName.bind(null, 1), shapeName.bind(null, 1), solidFromObject];
  GENERATORS.geometry[2] = [shapeSides.bind(null, 2), shapeName.bind(null, 2), shapeDescribe, shapeDescribe, shapeSymmetry, solidFromObject];
  GENERATORS.geometry[3] = [solidCount3, solidCount3, solidCount3, solidFromFaces, solidFromFaces];
  GENERATORS.geometry[4] = [rectProps4];
  GENERATORS.geometry[5] = [triProps5, triProps5, triProps5, rectProps4];
  GENERATORS.coordinates[1] = [position1, position1, steps1];
  GENERATORS.coordinates[2] = [mapRead2, mapRead2, mapMove2, mapMove2, position1];
  GENERATORS.coordinates[3] = [turn3, turn3, mapRoute3, mapRoute3];
  GENERATORS.coordinates[4] = [readPoint.bind(null, 4), readPoint.bind(null, 4), translatePt.bind(null, 4), findTranslation.bind(null, 4), reflectLine.bind(null, 4)];
  GENERATORS.coordinates[5] = [readPoint.bind(null, 5), translatePt.bind(null, 5), findTranslation.bind(null, 5), reflectLine.bind(null, 5), rotate180];
  GENERATORS.measurement[1] = [calendar1, calendar1, compare1, compare1];
  GENERATORS.measurement[2] = [ruler2, ruler2, cmm2, timeUnit2, nonStd2];
  GENERATORS.measurement[3] = [perimeter3, perimeter3, lenUnits3, clock3, clock3, timeFacts3, areaGrid3, areaGrid3];
  GENERATORS.measurement[4] = [massCap4, massCap4, elapsed45, elapsed45, angle4, angle4, areaRect4, areaRect4];
  GENERATORS.measurement[5] = [convert5, convert5, protractor5, protractor5, areaShapes5, areaShapes5, elapsed45];
  GENERATORS.financial[1] = [coinsShown1, coinsShown1, coinsText1, compareMoney1];
  GENERATORS.financial[2] = [coins2, coins2, coins2, coins2];
  GENERATORS.financial[3] = [change3, change3];
  GENERATORS.financial[4] = [cost4, cost4, cost4];
  GENERATORS.financial[5] = [tax5, tax5, budget5, unitRate5, bestValue5];

  // ---------- state ----------
  const MAX_QUESTIONS_PER_TOPIC = 5;
  const GRADE_KEY = 'mathPractice67_grade_v1';

  let stats = loadStats() || { correct: 0, total: 0, streak: 0 };
  let selectedGrade = loadGrade();
  let currentProblem = null;
  let answered = false;
  let session = null; // { topicId, index, correct, history }

  function loadStats() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (typeof parsed !== 'object' || parsed === null) return null;
      return { correct: parsed.correct || 0, total: parsed.total || 0, streak: parsed.streak || 0 };
    } catch (e) {
      return null;
    }
  }
  function saveStats() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch (e) {}
  }
  function loadGrade() {
    try {
      const raw = localStorage.getItem(GRADE_KEY);
      return /^[1-8]$/.test(raw || '') ? Number(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function saveGrade() {
    try { localStorage.setItem(GRADE_KEY, String(selectedGrade)); } catch (e) {}
  }

  // ---------- DOM ----------
  const gradeGate = document.getElementById('gradeGate');
  const mainArea = document.getElementById('mainArea');
  const currentGradeLabel = document.getElementById('currentGradeLabel');
  const changeGradeBtn = document.getElementById('changeGradeBtn');
  const topicButtons = document.getElementById('topicButtons');
  const scoreNum = document.getElementById('scoreNum');
  const streakNum = document.getElementById('streakNum');
  const accuracyNum = document.getElementById('accuracyNum');
  const resetBtn = document.getElementById('resetBtn');
  const emptyState = document.getElementById('emptyState');
  const problemArea = document.getElementById('problemArea');
  const summaryArea = document.getElementById('summaryArea');
  const summaryScore = document.getElementById('summaryScore');
  const summaryLabel = document.getElementById('summaryLabel');
  const practiceAgainBtn = document.getElementById('practiceAgainBtn');
  const topicTag = document.getElementById('topicTag');
  const progressTag = document.getElementById('progressTag');
  const questionText = document.getElementById('questionText');
  const questionVisual = document.getElementById('questionVisual');
  const answerHint = document.getElementById('answerHint');
  const answerInput = document.getElementById('answerInput');
  const actionBtn = document.getElementById('actionBtn');
  const feedback = document.getElementById('feedback');
  const feedbackHeadline = document.getElementById('feedbackHeadline');
  const feedbackSolution = document.getElementById('feedbackSolution');

  document.querySelectorAll('.grade-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedGrade = Number(btn.dataset.grade);
      saveGrade();
      enterMainArea();
    });
  });
  changeGradeBtn.addEventListener('click', () => {
    mainArea.style.display = 'none';
    gradeGate.style.display = 'block';
    session = null;
    currentProblem = null;
    emptyState.style.display = 'block';
    problemArea.style.display = 'none';
    summaryArea.style.display = 'none';
    topicButtons.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  });

  function enterMainArea() {
    gradeGate.style.display = 'none';
    mainArea.style.display = 'block';
    currentGradeLabel.textContent = `Grade ${selectedGrade}`;
    buildTopicButtons();
  }

  function topicButtonHtml(t) {
    return `<button type="button" class="topic-btn" data-topic="${t.id}">${escapeHtml(t.label)}</button>`;
  }
  // only the topics that have questions for the chosen grade are shown
  function buildTopicButtons() {
    const available = new Set(topicsFor(selectedGrade));
    const shown = TOPICS.filter(t => t.id === 'mixed' || available.has(t.id));
    const strands = [];
    shown.filter(t => t.strand).forEach(t => { if (!strands.includes(t.strand)) strands.push(t.strand); });
    let html = `<div class="topic-group"><div class="topic-group-buttons">${topicButtonHtml(TOPICS[0])}</div></div>`;
    strands.forEach(s => {
      html += `<div class="topic-group"><div class="topic-group-label">${escapeHtml(s)}</div><div class="topic-group-buttons">` +
        shown.filter(t => t.strand === s).map(t => topicButtonHtml(Object.assign({}, t, { label: labelFor(t.id, selectedGrade) }))).join('') + '</div></div>';
    });
    topicButtons.innerHTML = html;
    topicButtons.querySelectorAll('.topic-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        topicButtons.querySelectorAll('.topic-btn').forEach(b => b.classList.toggle('active', b === btn));
        startSession(btn.dataset.topic);
      });
    });
  }
  if (selectedGrade) enterMainArea();

  resetBtn.addEventListener('click', () => {
    stats = { correct: 0, total: 0, streak: 0 };
    saveStats();
    renderStats();

    session = null;
    currentProblem = null;
    answered = false;
    topicButtons.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
    problemArea.style.display = 'none';
    summaryArea.style.display = 'none';
    emptyState.style.display = 'block';
  });

  actionBtn.addEventListener('click', () => {
    if (!answered) {
      if (answerInput.value.trim() === '') return;
      submitAnswer();
    } else {
      advance();
    }
  });
  answerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (!answered) {
        if (answerInput.value.trim() === '') return;
        submitAnswer();
      } else {
        advance();
      }
    }
  });
  answerInput.addEventListener('input', () => {
    if (!answered) actionBtn.disabled = answerInput.value.trim() === '';
  });
  practiceAgainBtn.addEventListener('click', () => {
    const topicId = session.topicId;
    stats = { correct: 0, total: 0, streak: 0 };
    saveStats();
    renderStats();
    startSession(topicId);
  });

  function renderStats() {
    scoreNum.textContent = `${stats.correct} / ${stats.total}`;
    streakNum.textContent = `${stats.streak}`;
    accuracyNum.textContent = stats.total > 0 ? `${Math.round((stats.correct / stats.total) * 100)}%` : '—';
  }

  function startSession(topicId) {
    session = { topicId, index: 0, correct: 0, history: [] };
    summaryArea.style.display = 'none';
    advance();
  }

  function advance() {
    if (!session) return;
    if (session.index >= MAX_QUESTIONS_PER_TOPIC) {
      showSummary();
      return;
    }
    session.index += 1;
    currentProblem = generateProblem(session.topicId, selectedGrade);
    answered = false;
    emptyState.style.display = 'none';
    problemArea.style.display = 'block';
    summaryArea.style.display = 'none';
    topicTag.textContent = labelFor(currentProblem.topicId, selectedGrade);
    progressTag.textContent = `Question ${session.index} of ${MAX_QUESTIONS_PER_TOPIC}`;
    questionText.textContent = currentProblem.question;
    if (currentProblem.visual) {
      questionVisual.innerHTML = currentProblem.visual;
      questionVisual.style.display = 'block';
    } else {
      questionVisual.innerHTML = '';
      questionVisual.style.display = 'none';
    }
    answerHint.textContent = currentProblem.hint;
    answerInput.value = '';
    answerInput.disabled = false;
    answerInput.focus();
    actionBtn.textContent = 'Check';
    actionBtn.classList.remove('next');
    actionBtn.disabled = true;
    feedback.className = 'feedback';
    feedback.style.display = 'none';
  }

  function showSummary() {
    problemArea.style.display = 'none';
    summaryArea.style.display = 'block';
    summaryScore.textContent = `${session.correct} / ${MAX_QUESTIONS_PER_TOPIC}`;
    summaryLabel.textContent = `${labelFor(session.topicId, selectedGrade)} — nice work!`;

    const wrongCount = session.history.length - session.correct;
    document.getElementById('summaryCorrectCount').textContent = session.correct;
    document.getElementById('summaryWrongCount').textContent = wrongCount;

    const reviewList = document.getElementById('reviewList');
    reviewList.innerHTML = session.history.map((h, idx) => `
      <div class="review-item ${h.isCorrect ? 'item-correct' : 'item-wrong'}">
        <div class="review-item-head">
          <span class="review-item-num">Question ${idx + 1}${session.topicId === 'mixed' ? ' · ' + escapeHtml(h.topicLabel) : ''}</span>
          <span class="review-badge ${h.isCorrect ? 'correct' : 'wrong'}">${h.isCorrect ? 'Correct' : 'Wrong'}</span>
        </div>
        <div class="review-question">${escapeHtml(h.question)}</div>
        ${h.visual ? `<div class="visual">${h.visual}</div>` : ''}
        <div class="review-answer-line ${h.isCorrect ? 'correct-value' : 'wrong-value'}">Your answer: <b>${escapeHtml(h.userAnswer)}</b></div>
        ${h.isCorrect ? '' : `<div class="review-answer-line correct-value">Correct answer: <b>${escapeHtml(h.correctDisplay)}</b></div>`}
        <div class="review-steps"><span class="steps-label">Steps:</span>${escapeHtml(h.solution)}</div>
      </div>
    `).join('');
  }

  function submitAnswer() {
    if (!currentProblem || answered) return;
    const raw = answerInput.value;
    const isCorrect = checkAnswer(currentProblem, raw);

    stats.total += 1;
    if (isCorrect) {
      stats.correct += 1;
      stats.streak += 1;
      session.correct += 1;
    } else {
      stats.streak = 0;
    }
    saveStats();
    renderStats();

    session.history.push({
      question: currentProblem.question,
      visual: currentProblem.visual || '',
      topicLabel: labelFor(currentProblem.topicId, selectedGrade),
      userAnswer: raw,
      isCorrect,
      correctDisplay: currentProblem.correctDisplay,
      solution: currentProblem.solution
    });

    answered = true;
    answerInput.disabled = true;
    actionBtn.disabled = false;
    actionBtn.textContent = session.index >= MAX_QUESTIONS_PER_TOPIC ? 'See results' : 'Next question';
    actionBtn.classList.add('next');

    feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
    feedback.style.display = 'block';
    feedbackHeadline.textContent = isCorrect
      ? 'Correct!'
      : `Not quite — the answer is ${currentProblem.correctDisplay}`;
    feedbackSolution.textContent = currentProblem.solution;

    actionBtn.focus();
  }


  renderStats();
})();
</script>
</body>
</html>
