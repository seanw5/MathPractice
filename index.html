<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grade 1&ndash;8 Math Practice</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --border: #e2e8f2;
    --text: #1a2332;
    --dim: #6b7488;
    --accent: #3d7dfb;
    --accent-dim: #e9f0ff;
    --green: #1a9e6b;
    --green-dim: #e6f7ef;
    --red: #e0453f;
    --red-dim: #fdeceb;
    --amber: #b5750a;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(20, 30, 60, 0.06), 0 8px 24px rgba(20, 30, 60, 0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { padding: 28px 16px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 22px; }
  header h1 { font-size: 25px; margin: 0 0 4px; letter-spacing: -0.3px; }
  header p { color: var(--dim); margin: 0; font-size: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 18px;
  }

  .section-title {
    font-size: 16px;
    margin: 0 0 14px;
    text-align: center;
  }
  .grade-options {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .grade-btn {
    flex: 1 1 200px;
    min-width: 0;
    text-align: left;
    padding: 16px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: all 0.12s;
  }
  .grade-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
  .grade-btn .grade-num { font-size: 17px; font-weight: 700; color: var(--text); }
  .grade-btn .grade-desc { font-size: 13px; color: var(--dim); line-height: 1.4; }

  .grade-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px 12px;
    font-size: 13.5px;
    color: var(--dim);
  }

  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .topic-btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--dim);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.12s;
  }
  .topic-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topic-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .topic-group { margin-top: 14px; }
  .topic-group:first-child { margin-top: 0; flex: 0 0 100%; } /* the Mixed button always sits on its own row */
  .topic-group-label {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 7px;
  }
  .topic-group-buttons { display: flex; flex-wrap: wrap; gap: 8px; }

  .visual {
    margin: 4px 0 14px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fbfcfe;
    overflow-x: auto;
  }
  .visual svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .visual table { border-collapse: collapse; margin: 0 auto; font-size: 14px; }
  .visual td, .visual th { border: 1px solid var(--border); padding: 5px 12px; text-align: center; }
  .visual th { background: var(--accent-dim); color: var(--text); font-weight: 700; }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
  }
  .stats {
    display: flex;
    gap: 22px;
  }
  .stat { text-align: left; }
  .stat .num { font-size: 19px; font-weight: 700; }
  .stat .lbl { font-size: 11.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat.streak .num { color: var(--accent); }
  .stat.accuracy .num { color: var(--green); }
  button.reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.reset-btn:hover { border-color: var(--red); color: var(--red); }

  .problem-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .topic-tag {
    display: inline-block;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .progress-tag {
    font-size: 12.5px;
    color: var(--dim);
    font-weight: 600;
  }

  .summary-score {
    font-size: 40px;
    font-weight: 800;
    text-align: center;
    color: var(--accent);
    margin-top: 10px;
  }
  .summary-label {
    text-align: center;
    color: var(--dim);
    font-size: 14.5px;
    margin: 6px 0 20px;
  }
  .summary-breakdown {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 20px;
  }
  .breakdown-stat { text-align: center; }
  .breakdown-stat .num { font-size: 22px; font-weight: 800; }
  .breakdown-stat .lbl { font-size: 11.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .breakdown-stat.correct-stat .num { color: var(--green); }
  .breakdown-stat.wrong-stat .num { color: var(--red); }
  #summaryArea .primary { display: block; margin: 0 auto; }

  .review-heading {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--dim);
    margin: 28px 0 12px;
    text-align: center;
  }
  .review-list {
    max-height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 2px 2px 4px;
  }
  .review-item {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .review-item.item-correct { border-left: 4px solid var(--green); }
  .review-item.item-wrong { border-left: 4px solid var(--red); }
  .review-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .review-item-num { font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .review-badge {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .review-badge.correct { background: var(--green-dim); color: var(--green); }
  .review-badge.wrong { background: var(--red-dim); color: var(--red); }
  .review-question { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .review-answer-line { font-size: 13.5px; color: var(--dim); margin-bottom: 4px; }
  .review-answer-line b { color: var(--text); font-weight: 600; }
  .review-answer-line.wrong-value b { color: var(--red); }
  .review-answer-line.correct-value b { color: var(--green); }
  .review-steps {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 13.5px;
    color: var(--text);
    opacity: 0.85;
    line-height: 1.5;
  }
  .review-steps .steps-label { font-weight: 700; opacity: 1; margin-right: 4px; }

  .question {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.4;
    letter-spacing: -0.2px;
  }
  .hint {
    font-size: 12.5px;
    color: var(--dim);
    margin-bottom: 8px;
  }

  .answer-row {
    display: flex;
    gap: 10px;
  }
  #answerInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-size: 17px;
    font-family: inherit;
    color: var(--text);
  }
  #answerInput:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  #answerInput:disabled { background: #f7f8fb; color: var(--dim); }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0 22px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary.next { background: var(--green); }

  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 15px;
    display: none;
  }
  .feedback.correct {
    display: block;
    background: var(--green-dim);
    color: var(--green);
  }
  .feedback.incorrect {
    display: block;
    background: var(--red-dim);
    color: var(--red);
  }
  .feedback .headline { font-weight: 700; margin-bottom: 6px; }
  .feedback .solution {
    color: var(--text);
    opacity: 0.85;
    font-size: 14px;
    line-height: 1.55;
    font-weight: 400;
  }

  .empty-state {
    text-align: center;
    color: var(--dim);
    padding: 30px 10px;
    font-size: 14.5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Grade 1&ndash;8 Math Practice</h1>
    <p>Based on the Ontario Mathematics Curriculum (2020). Pick a topic and work through problems, one at a time.</p>
  </header>

  <div class="card" id="gradeGate">
    <h2 class="section-title">Which grade are you practicing?</h2>
    <div class="grade-options">
      <button type="button" class="grade-btn" data-grade="1">
        <span class="grade-num">Grade 1</span>
        <span class="grade-desc">Counting to 50, adding &amp; subtracting to 20, fair sharing, patterns, shapes, coins</span>
      </button>
      <button type="button" class="grade-btn" data-grade="2">
        <span class="grade-num">Grade 2</span>
        <span class="grade-desc">Numbers to 200, adding &amp; subtracting to 100, equal groups, even &amp; odd, bar graphs, cm &amp; m</span>
      </button>
      <button type="button" class="grade-btn" data-grade="3">
        <span class="grade-num">Grade 3</span>
        <span class="grade-desc">Numbers to 1000, rounding, times tables (2, 5, 10), fractions, perimeter, clocks, change</span>
      </button>
      <button type="button" class="grade-btn" data-grade="4">
        <span class="grade-num">Grade 4</span>
        <span class="grade-desc">Numbers to 10 000, multiplication &amp; division, tenths, mean &amp; median, coordinates, angles</span>
      </button>
      <button type="button" class="grade-btn" data-grade="5">
        <span class="grade-num">Grade 5</span>
        <span class="grade-desc">Numbers to 100 000, fractions &amp; hundredths, percents, area, protractors, unit rates</span>
      </button>
      <button type="button" class="grade-btn" data-grade="6">
        <span class="grade-num">Grade 6</span>
        <span class="grade-desc">Compare integers, fractions &amp; decimals, divisibility &amp; prime factors, ratios &amp; rates, linear patterns, equations &amp; inequalities, mean/median/mode/range, probability, angles, trapezoids &amp; surface area, coordinates</span>
      </button>
      <button type="button" class="grade-btn" data-grade="7">
        <span class="grade-num">Grade 7</span>
        <span class="grade-desc">Integer add/subtract, fractions &amp; decimals multiply/divide, exponents &amp; GCF/LCM, proportional reasoning, percent change, equations with decimals, dependent events, circles &amp; cylinders, dilations, currency exchange</span>
      </button>
      <button type="button" class="grade-btn" data-grade="8">
        <span class="grade-num">Grade 8</span>
        <span class="grade-desc">Scientific notation, irrational numbers &amp; square roots, integer multiply/divide, mixed-number fractions, percents over 100%, scatter plots &amp; outliers, Pythagorean theorem, composite shapes, compound interest</span>
      </button>
    </div>
  </div>

  <div id="mainArea" style="display:none;">
    <div class="grade-bar">
      <span>Practicing <b id="currentGradeLabel"></b></span>
      <button type="button" class="reset-btn" id="changeGradeBtn">Change grade</button>
    </div>

    <div class="card">
      <div class="topics" id="topicButtons"></div>
    </div>

    <div class="card stats-bar">
      <div class="stats">
        <div class="stat">
          <div class="num" id="scoreNum">0 / 0</div>
          <div class="lbl">Score</div>
        </div>
        <div class="stat streak">
          <div class="num" id="streakNum">0</div>
          <div class="lbl">Streak</div>
        </div>
        <div class="stat accuracy">
          <div class="num" id="accuracyNum">&mdash;</div>
          <div class="lbl">Accuracy</div>
        </div>
      </div>
      <button type="button" class="reset-btn" id="resetBtn">Reset stats</button>
    </div>

    <div class="card" id="problemCard">
      <div class="empty-state" id="emptyState">Choose a topic above to start practicing.</div>
      <div id="problemArea" style="display:none;">
        <div class="problem-header">
          <div class="topic-tag" id="topicTag"></div>
          <div class="progress-tag" id="progressTag"></div>
        </div>
        <div class="question" id="questionText"></div>
        <div class="visual" id="questionVisual" style="display:none;"></div>
        <div class="hint" id="answerHint"></div>
        <div class="answer-row">
          <input type="text" id="answerInput" autocomplete="off" placeholder="Your answer" />
          <button type="button" class="primary" id="actionBtn" disabled>Check</button>
        </div>
        <div class="feedback" id="feedback">
          <div class="headline" id="feedbackHeadline"></div>
          <div class="solution" id="feedbackSolution"></div>
        </div>
      </div>
      <div id="summaryArea" style="display:none;">
        <div class="summary-score" id="summaryScore"></div>
        <div class="summary-label" id="summaryLabel"></div>
        <div class="summary-breakdown">
          <div class="breakdown-stat correct-stat">
            <div class="num" id="summaryCorrectCount"></div>
            <div class="lbl">Correct</div>
          </div>
          <div class="breakdown-stat wrong-stat">
            <div class="num" id="summaryWrongCount"></div>
            <div class="lbl">Wrong</div>
          </div>
        </div>
        <button type="button" class="primary" id="practiceAgainBtn">Practice again</button>
        <div class="review-heading">Review your answers</div>
        <div class="review-list" id="reviewList"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'mathPractice67_stats_v1';

  // ---------- math helpers ----------
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
  function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }
  function reduceFrac(n, d) {
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  function fracStr(n, d) {
    if (d < 0) { n = -n; d = -d; }
    if (d === 1) return `${n}`;
    return `${n}/${d}`;
  }
  function mixedStr(n, d) {
    if (d === 1) return `${n}`;
    const neg = n < 0, a = Math.abs(n);
    const w = Math.floor(a / d), r = a % d;
    if (w === 0) return fracStr(n, d);
    const sign = neg ? '-' : '';
    return r === 0 ? `${sign}${w}` : `${sign}${w} ${r}/${d}`;
  }
  function fracDisplay(n, d) {
    return d > 1 && Math.abs(n) > d ? `${fracStr(n, d)} (or ${mixedStr(n, d)})` : fracStr(n, d);
  }
  function fmtSigned(n) { return n < 0 ? `(${n})` : `${n}`; }
  function r6(x) { return Math.round(x * 1e6) / 1e6; }
  function n2s(x) { return String(r6(x)); }
  function round2(x) { return Math.round(x * 100) / 100; }
  function money(x) { return '$' + (Math.round(x * 100) / 100).toFixed(2); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  const SUPDIGITS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  function sup(n) { return String(n).split('').map(c => SUPDIGITS[+c]).join(''); }
  function fmtBig(n) {
    const s = String(Math.abs(n));
    const out = s.length >= 5 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : s;
    return (n < 0 ? '-' : '') + out;
  }
  function plural(n, one, many) { return n === 1 ? one : many; }

  // ---------- units accepted alongside a numeric answer ----------
  function normUnit(s) {
    return String(s).toLowerCase().replace(/²/g, '2').replace(/³/g, '3').replace(/[\s.^_·]/g, '');
  }
  const UNIT_ALIASES = {
    mm: ['mm', 'millimetre', 'millimetres', 'millimeter', 'millimeters'],
    cm: ['cm', 'centimetre', 'centimetres', 'centimeter', 'centimeters'],
    m: ['m', 'metre', 'metres', 'meter', 'meters'],
    km: ['km', 'kilometre', 'kilometres', 'kilometer', 'kilometers'],
    g: ['g', 'gram', 'grams'],
    kg: ['kg', 'kilogram', 'kilograms'],
    mL: ['ml', 'millilitre', 'millilitres', 'milliliter', 'milliliters'],
    L: ['l', 'litre', 'litres', 'liter', 'liters'],
    cm2: ['cm2', 'sqcm', 'squarecm', 'squarecentimetre', 'squarecentimetres', 'squarecentimeter', 'squarecentimeters'],
    m2: ['m2', 'sqm', 'squarem', 'squaremetre', 'squaremetres', 'squaremeter', 'squaremeters'],
    cm3: ['cm3', 'cubiccm', 'cubiccentimetre', 'cubiccentimetres', 'cubiccentimeter', 'cubiccentimeters', 'cc'],
    m3: ['m3', 'cubicm', 'cubicmetre', 'cubicmetres', 'cubicmeter', 'cubicmeters'],
    deg: ['°', 'deg', 'degree', 'degrees'],
    degC: ['°c', 'c', '°', 'degreescelsius', 'degrees', 'degree', 'deg'],
    dollar: ['$', 'dollar', 'dollars', 'cad'],
    usd: ['usd', '$', 'dollar', 'dollars', 'us$', 'usdollars'],
    eur: ['eur', 'euro', 'euros', '€'],
    kmh: ['km/h', 'kmh', 'km/hr', 'kph', 'kmperhour'],
    perMin: ['/min', 'permin', 'perminute', 'wpm', 'words/min', 'wordsperminute', 'wordsmin'],
    weeks: ['week', 'weeks', 'wk', 'wks'],
    months: ['month', 'months', 'mo'],
    percent: ['%', 'percent'],
    cents: ['¢', 'c', 'cent', 'cents'],
    minutes: ['min', 'mins', 'minute', 'minutes'],
    seconds: ['s', 'sec', 'secs', 'second', 'seconds'],
    hours: ['h', 'hr', 'hrs', 'hour', 'hours']
  };
  function units(...keys) {
    const out = [];
    keys.forEach(k => (UNIT_ALIASES[k] || [k]).forEach(u => out.push(normUnit(u))));
    return out;
  }

  // ---------- answer parsing ----------
  function parseNumber(raw, allowedUnits) {
    const s = String(raw).trim().replace(/[−–]/g, '-').replace(/^[a-zA-Z]\s*=\s*/, '').replace(/^\$\s*/, '');
    const m = s.match(/^(-?\d[\d,\s ]*(?:\.\d+)?|-?\.\d+)\s*(.*)$/);
    if (!m) return null;
    const num = Number(m[1].replace(/[,\s ]/g, ''));
    if (Number.isNaN(num)) return null;
    const u = normUnit(m[2]);
    if (u !== '' && u !== '%' && !(allowedUnits || []).includes(u)) return null;
    return num;
  }

  function parseFraction(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-');
    let m = s.match(/^(-?)\s*(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (m) {
      const d = +m[4];
      if (!d) return null;
      const n = (+m[2]) * d + (+m[3]);
      return { n: m[1] === '-' ? -n : n, d };
    }
    m = s.match(/^(-?\d+)\s*[\/:]\s*(-?\d+)$/);
    if (m) {
      let n = +m[1], d = +m[2];
      if (!d) return null;
      if (d < 0) { n = -n; d = -d; }
      return { n, d };
    }
    if (/^-?\d+$/.test(s)) return { n: +s, d: 1 };
    return null;
  }

  function parseRational(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-');
    const f = parseFraction(s);
    if (f) return { kind: /[\/:]/.test(s) ? 'frac' : 'int', value: f.n / f.d };
    const pm = s.match(/^(-?\d*\.?\d+)\s*%$/);
    if (pm) return { kind: 'pct', value: Number(pm[1]) };
    if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return { kind: 'dec', value: Number(s) };
    return null;
  }

  function normText(s) {
    let t = String(s).toLowerCase();
    t = t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => '^' + SUPDIGITS.indexOf(c));
    t = t.replace(/\*\*/g, '^').replace(/[−–]/g, '-');
    return t.replace(/[\s*×·.'"`]/g, '').replace(/-/g, '');
  }

  // text answers where a minus sign matters (e.g. algebraic expressions): keep '-', drop spaces and multiplication signs
  function normExpr(s) {
    let t = String(s).toLowerCase();
    t = t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => '^' + SUPDIGITS.indexOf(c));
    t = t.replace(/\*\*/g, '^').replace(/[−–]/g, '-');
    return t.replace(/[\s*×·.'"`]/g, '');
  }

  // scientific notation: "3.2 x 10^5", "3.2×10⁵", "3.2*10^-4", "3.2e5"
  function parseSci(raw) {
    let s = String(raw).trim().toLowerCase().replace(/[−–]/g, '-').replace(/\s+/g, '');
    s = s.replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => '^' + m.split('').map(c => c === '⁻' ? '-' : SUPDIGITS.indexOf(c)).join(''));
    let m = s.match(/^(-?(?:\d+\.?\d*|\.\d+))[×x*·]10\^?(-?\d+)$/);
    if (!m) m = s.match(/^(-?(?:\d+\.?\d*|\.\d+))e(-?\d+)$/);
    return m ? { mant: Number(m[1]), exp: Number(m[2]) } : null;
  }

  function parseList(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-').replace(/[(){}\[\]]/g, '');
    const parts = s.split(/[\s,;×x*]+/).filter(p => p !== '');
    const nums = parts.map(Number);
    return nums.some(Number.isNaN) ? null : nums;
  }

  function parsePoint(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-');
    const m = s.match(/^\(?\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*\)?$/);
    return m ? { x: Number(m[1]), y: Number(m[2]) } : null;
  }

  function checkAnswer(problem, raw) {
    if (raw === null || raw === undefined || String(raw).trim() === '') return false;
    const c = problem.correct;
    switch (problem.answerType) {
      case 'number': {
        const v = parseNumber(raw, problem.units);
        return v !== null && Math.abs(v - c.value) <= c.tolerance + 1e-12;
      }
      case 'fraction': {
        const p = parseFraction(raw);
        if (!p || p.n * c.d !== c.n * p.d) return false;
        return !c.requireLowest || gcd(p.n, p.d) === 1;
      }
      case 'ratio': {
        const p = parseFraction(raw);
        return !!p && /[\/:]/.test(String(raw)) && p.n * c.d === c.n * p.d;
      }
      case 'rational': {
        const p = parseRational(raw);
        if (!p) return false;
        if (p.kind === 'pct') return Math.abs(p.value - c.value * 100) <= (c.tolPct === undefined ? 1e-7 : c.tolPct);
        if (p.kind === 'dec') return Math.abs(p.value - c.value) <= (c.tol === undefined ? 1e-9 : c.tol);
        return Math.abs(p.value - c.value) <= 1e-9;
      }
      case 'sequence': {
        let got = parseList(raw);
        if (!got || got.length !== c.sequence.length) return false;
        let want = c.sequence;
        if (c.unordered) { got = got.slice().sort((a, b) => a - b); want = want.slice().sort((a, b) => a - b); }
        return got.every((v, i) => Math.abs(v - want[i]) < 1e-9);
      }
      case 'rationalSequence': {
        const parts = String(raw).split(/[;,]\s*/).filter(p => p.trim() !== '');
        if (parts.length !== c.values.length) return false;
        const vals = parts.map(p => parseRational(p));
        if (vals.some(v => v === null || v.kind === 'pct')) return false;
        return vals.every((v, i) => Math.abs(v.value - c.values[i]) < 1e-9);
      }
      case 'text': {
        const norm = c.keepSign ? normExpr : normText;
        const t = norm(raw);
        return c.accepted.some(a => norm(a) === t);
      }
      case 'sci': {
        const p = parseSci(raw);
        return !!p && p.exp === c.exp && Math.abs(p.mant - c.mant) < 1e-9;
      }
      case 'point': {
        const p = parsePoint(raw);
        return !!p && Math.abs(p.x - c.x) < 1e-9 && Math.abs(p.y - c.y) < 1e-9;
      }
    }
    return false;
  }

  // ---------- problem builders ----------
  function makeNum(topicId, question, value, solution, o = {}) {
    return {
      topicId, question, visual: o.visual || '',
      hint: o.hint || 'Enter a number.',
      answerType: 'number',

      correctDisplay: o.display !== undefined ? o.display : n2s(value),
      solution
    };
  }
  function makeFrac(topicId, question, n, d, solution, o = {}) {

      topicId, question, visual: o.visual || '',
      hint: o.hint || (o.requireLowest
        ? 'Enter your answer in lowest terms, e.g. 3/4.'
        : 'Enter a fraction (e.g. 3/4) or a mixed number (e.g. 1 1/2). Any equivalent fraction is accepted.'),
      answerType: 'fraction',
      correct: { n: r.n, d: r.d, requireLowest: !!o.requireLowest },
      correctDisplay: o.display !== undefined ? o.display : fracDisplay(r.n, r.d),
      solution
    };
  }
  function makeRatio(topicId, question, a, b, solution, o = {}) {
    const r = reduceFrac(a, b);
    return {
      topicId, question, visual: o.visual || '',

      answerType: 'ratio',

      correctDisplay: `${r.n}:${r.d}`,

  }
  function makeSeq(topicId, question, arr, solution, o = {}) {

      answerType: 'sequence',
      correct: { sequence: arr, unordered: !!o.unordered },

  }
  function makeRat(topicId, question, value, solution, o = {}) {
    return {
      topicId, question, visual: o.visual || '',
      hint: o.hint || 'Enter a fraction, a decimal, or a percent.',
      answerType: 'rational',
      correct: { value, tol: o.tol, tolPct: o.tolPct },

  }
  function makeRatSeq(topicId, question, values, display, solution, o = {}) {
    return {
      topicId, question, visual: o.visual || '',

      answerType: 'rationalSequence',
      correct: { values },
      correctDisplay: display,
      solution
    };
  }
  function supInt(n) { return (n < 0 ? '⁻' : '') + sup(Math.abs(n)); }
  function makeSci(topicId, question, mant, exp, solution, o = {}) {
    return {
      topicId, question, visual: o.visual || '',
      hint: o.hint || 'Type it like 3.2 x 10^5 (use ^ for the exponent, or just copy the form 3.2e5).',
      answerType: 'sci',
      correct: { mant, exp },
      correctDisplay: `${mant} × 10${supInt(exp)}`,
      solution
    };
  }
  function makeText(topicId, question, accepted, display, solution, o = {}) {
    return {
      topicId, question, visual: o.visual || '',
      hint: o.hint || 'Type your answer.',
      answerType: 'text',
      correct: { accepted, keepSign: !!o.keepSign },
      correctDisplay: display,
      solution
    };
  }
  function makePoint(topicId, question, x, y, solution, o = {}) {
    return {
      topicId, question, visual: o.visual || '',
      hint: o.hint || 'Enter an ordered pair, e.g. (3, -2).',
      answerType: 'point',
      correct: { x, y },
      correctDisplay: `(${x}, ${y})`,
      solution
    };
  }
  const YES_NO_HINT = 'Type yes or no.';
  function makeYesNo(topicId, question, yes, solution, o = {}) {
    return makeText(topicId, question, yes ? ['yes', 'y'] : ['no', 'n'], yes ? 'Yes' : 'No', solution, { hint: YES_NO_HINT, visual: o.visual });
  }

  // ---------- visuals (inline SVG / HTML) ----------
  const COLORS = ['#4f6df5', '#17a673', '#e5484d', '#f5a623', '#8e5cf7', '#0fb5ba', '#d6409f', '#7a8499'];
  function niceStep(max, targetLines) {
    for (const s of [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000]) if (max / s <= (targetLines || 6)) return s;
    return 1000;
  }
  function chartFrame(W, H, L, R, T, B, top, step, title, yTitle) {
    const plotH = H - T - B;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">`;
    s += `<text x="${W / 2}" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">${escapeHtml(title || '')}</text>`;
    for (let v = 0; v <= top + 1e-9; v += step) {
      const y = T + plotH - (v / top) * plotH;
      s += `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="#e2e8f2" />`;
      s += `<text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6b7488">${n2s(v)}</text>`;
    }
    if (yTitle) s += `<text transform="translate(12 ${T + plotH / 2}) rotate(-90)" text-anchor="middle" font-size="11" fill="#6b7488">${escapeHtml(yTitle)}</text>`;
    return s;
  }
  function svgBar(labels, values, o = {}) {
    const W = 360, H = 230, L = 46, R = 12, T = 28, B = 50;
    const plotW = W - L - R, plotH = H - T - B;
    const maxV = o.max !== undefined ? o.max : Math.max(...values);
    const step = o.step || niceStep(maxV, 6);
    const top = Math.ceil(maxV / step) * step;
    let s = chartFrame(W, H, L, R, T, B, top, step, o.title, o.yTitle);
    const n = values.length, slot = plotW / n, bw = o.histogram ? slot : slot * 0.6;
    values.forEach((v, i) => {
      const x = L + i * slot + (slot - bw) / 2;
      const h = (v / top) * plotH;
      s += `<rect x="${x}" y="${T + plotH - h}" width="${bw}" height="${h}" fill="${COLORS[0]}" stroke="${o.histogram ? '#fff' : 'none'}" />`;
      s += `<text x="${L + i * slot + slot / 2}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="#1a2332">${escapeHtml(labels[i])}</text>`;
    });
    if (o.xTitle) s += `<text x="${L + plotW / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#6b7488">${escapeHtml(o.xTitle)}</text>`;
    return s + '</svg>';
  }
  function svgLine(labels, values, o = {}) {
    const W = 360, H = 230, L = 46, R = 16, T = 28, B = 50;
    const plotW = W - L - R, plotH = H - T - B;
    const maxV = o.max !== undefined ? o.max : Math.max(...values);
    const step = o.step || niceStep(maxV, 6);
    const top = Math.ceil(maxV / step) * step;
    let s = chartFrame(W, H, L, R, T, B, top, step, o.title, o.yTitle);
    const n = values.length, slot = plotW / n;
    const pts = values.map((v, i) => [L + i * slot + slot / 2, T + plotH - (v / top) * plotH]);
    s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${COLORS[0]}" stroke-width="2.5" />`;
    pts.forEach((p, i) => {
      s += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${COLORS[0]}" />`;
      s += `<text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle" font-size="11" fill="#1a2332">${n2s(values[i])}</text>`;
      s += `<text x="${p[0]}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="#1a2332">${escapeHtml(labels[i])}</text>`;
    });
    if (o.xTitle) s += `<text x="${L + plotW / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#6b7488">${escapeHtml(o.xTitle)}</text>`;
    return s + '</svg>';
  }
  function svgPie(labels, pcts, o = {}) {
    const W = 360, H = 210, cx = 100, cy = 118, r = 76;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">`;
    s += `<text x="${W / 2}" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">${escapeHtml(o.title || '')}</text>`;
    let a0 = -Math.PI / 2;
    pcts.forEach((p, i) => {
      const a1 = a0 + (p / 100) * 2 * Math.PI;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      s += `<path d="M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${p > 50 ? 1 : 0} 1 ${x1} ${y1} Z" fill="${COLORS[i % COLORS.length]}" stroke="#fff" stroke-width="1.5" />`;
      a0 = a1;
    });
    labels.forEach((l, i) => {
      const y = 50 + i * 24;
      s += `<rect x="215" y="${y - 10}" width="14" height="14" rx="3" fill="${COLORS[i % COLORS.length]}" />`;
      s += `<text x="236" y="${y + 2}" font-size="13" fill="#1a2332">${escapeHtml(l)}: ${n2s(pcts[i])}%</text>`;
    });
    return s + '</svg>';
  }
  // Cartesian plane showing labelled points: pts = [{x, y, label}]
  function svgPlane(pts, o = {}) {
    const R = o.range || 8, cell = 20, pad = 22, size = R * 2 * cell + pad * 2;
    const X = v => pad + (v + R) * cell, Y = v => pad + (R - v) * cell;
    let s = `<svg viewBox="0 0 ${size} ${size}" width="${Math.min(size, 360)}" role="img" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">`;
    for (let v = -R; v <= R; v++) {
      s += `<line x1="${X(v)}" y1="${Y(R)}" x2="${X(v)}" y2="${Y(-R)}" stroke="${v === 0 ? '#1a2332' : '#e2e8f2'}" stroke-width="${v === 0 ? 1.8 : 1}" />`;
      s += `<line x1="${X(-R)}" y1="${Y(v)}" x2="${X(R)}" y2="${Y(v)}" stroke="${v === 0 ? '#1a2332' : '#e2e8f2'}" stroke-width="${v === 0 ? 1.8 : 1}" />`;
      if (v !== 0 && v % 2 === 0) {
        s += `<text x="${X(v)}" y="${Y(0) + 13}" text-anchor="middle" font-size="9" fill="#6b7488">${v}</text>`;
        s += `<text x="${X(0) - 5}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="#6b7488">${v}</text>`;
      }
    }
    s += `<text x="${X(R) + 2}" y="${Y(0) - 4}" font-size="11" font-weight="700" fill="#1a2332">x</text>`;
    s += `<text x="${X(0) + 5}" y="${Y(R) + 10}" font-size="11" font-weight="700" fill="#1a2332">y</text>`;
    (pts || []).forEach((p, i) => {
      s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${COLORS[i % 3 === 0 ? 0 : (i % 3 === 1 ? 2 : 1)]}" />`;
      s += `<text x="${X(p.x) + 7}" y="${Y(p.y) - 6}" font-size="12" font-weight="700" fill="#1a2332">${escapeHtml(p.label || '')}</text>`;
    });
    return s + '</svg>';
  }
  function htmlTable(headers, rows) {
    return '<table><tr>' + headers.map(h => `<th>${escapeHtml(h)}</th>`).join('') + '</tr>' +
      rows.map(r => '<tr>' + r.map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>').join('') + '</table>';

  // ---------- topics ----------
  const TOPICS = [
    { id: 'mixed', label: 'Mixed', strand: null },

  const PRACTICE_TOPIC_IDS = TOPICS.filter(t => t.id !== 'mixed').map(t => t.id);
  const TOPIC_LABEL = Object.fromEntries(TOPICS.map(t => [t.id, t.label]));

  const GENERATORS = {};
  // topics that have questions for a grade (the topic buttons and Mixed use this)
  function topicsFor(grade) { return PRACTICE_TOPIC_IDS.filter(t => GENERATORS[t] && GENERATORS[t][grade]); }
  // a few topics are named differently in the primary grades
  const LABEL_BY_GRADE = { coordinates: { 1: 'Location & Movement', 2: 'Location & Movement', 3: 'Location & Movement' } };
  function labelFor(id, grade) { return (LABEL_BY_GRADE[id] && LABEL_BY_GRADE[id][grade]) || TOPIC_LABEL[id]; }

  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  const NAMES = ['Maya', 'Liam', 'Aisha', 'Noah', 'Priya', 'Ethan', 'Sofia', 'Omar', 'Chloe', 'Daniel'];

  // =====================================================================
  // NUMBER: integers  (Gr 6: B1.2, B1.3 read/compare/order integers;
  //                    Gr 7: B2.4 add and subtract integers)
  // =====================================================================
  function intsCompare() {
    const a = randInt(-20, 20);
    let b = randInt(-20, 20);
    while (b === a) b = randInt(-20, 20);
    const greater = Math.random() < 0.5;
    const ans = greater ? Math.max(a, b) : Math.min(a, b);
    return makeNum('integers', `Which is ${greater ? 'greater' : 'less'}: ${fmtSigned(a)} or ${fmtSigned(b)}?`, ans,
      `On a number line, ${greater ? 'the number further right is greater' : 'the number further left is less'}: ${ans}.`,
      { hint: 'Enter the number itself.' });
  }
  function intsOrder() {
    const nums = new Set();
    while (nums.size < 4) nums.add(randInt(-20, 20));
    const list = shuffle([...nums]);
    const sorted = [...list].sort((x, y) => x - y);
    return makeSeq('integers', `Order from least to greatest: ${list.join(', ')}`, sorted,
      `On a number line, least to greatest means left to right: ${sorted.join(', ')}.`,
      { hint: 'Enter the numbers separated by commas, e.g. -3, 0, 5.' });
  }
  function intsOpposite() {
    const n = randInt(1, 20) * (Math.random() < 0.5 ? -1 : 1);
    return makeNum('integers', `What is the opposite of ${fmtSigned(n)}?`, -n,
      `Opposite integers are the same distance from zero on opposite sides of zero: the opposite of ${n} is ${-n}.`);
  }
  function intsAbs() {
    const n = randInt(1, 25) * (Math.random() < 0.5 ? -1 : 1);
    return makeNum('integers', `What is the absolute value of ${fmtSigned(n)}?`, Math.abs(n),
      `Absolute value is the distance from zero on the number line. ${n} is ${Math.abs(n)} units from zero.`);
  }
  function intsFreezing() {
    const t = -randInt(1, 25);
    return makeNum('integers', `The temperature is ${t}°C. How many degrees below freezing (0°C) is that?`, -t,
      `${t}°C is ${-t} degrees below 0°C.`, { units: units('degC', 'deg') });
  }
  function signedStyle(n) { return n < 0 ? `(-${-n})` : `(+${n})`; }
  function intsAddSub7() {
    const a = randInt(-15, 15), b = randInt(-15, 15);
    const op = pick(['+', '-']);
    const style = Math.random() < 0.5 ? signedStyle : fmtSigned;
    const result = op === '+' ? a + b : a - b;
    const q = `${style(a)} ${op} ${style(b)}`;
    const steps = op === '+'
      ? `${a} + ${fmtSigned(b)} = ${result}`
      : `Subtracting is the same as adding the opposite: ${a} + ${fmtSigned(-b)} = ${result}`;
    return makeNum('integers', `${q} = ?`, result, steps, { hint: 'Enter an integer.' });
  }
  function intsContext7() {
    const t = randInt(1, 4);
    if (t === 1) {
      const t0 = randInt(-15, 3), r = randInt(3, 20);
      return makeNum('integers', `At 6 a.m. the temperature was ${t0}°C. By noon it had risen ${r}°C. What was the temperature at noon?`, t0 + r,
        `Rising is adding: ${fmtSigned(t0)} + ${r} = ${t0 + r}°C.`, { units: units('degC', 'deg') });
    }
    if (t === 2) {
      const t0 = randInt(-5, 12), d = randInt(5, 25);
      return makeNum('integers', `At noon the temperature was ${t0}°C. By midnight it had dropped ${d}°C. What was the temperature at midnight?`, t0 - d,
        `Dropping is subtracting: ${fmtSigned(t0)} − ${d} = ${t0 - d}°C.`, { units: units('degC', 'deg') });
    }
    if (t === 3) {
      const start = -randInt(1, 4), down = randInt(1, 3), up = randInt(2, 6);
      return makeNum('integers', `An underground parking garage has levels labelled with negative numbers. A car is on level ${start}. It goes down ${down} more ${plural(down, 'level', 'levels')} and then up ${up} ${plural(up, 'level', 'levels')}. Which level is it on now?`, start - down + up,
        `${start} − ${down} + ${up} = ${start - down + up}.`, { hint: 'Enter an integer.' });
    }
    const bal = -randInt(5, 30), dep = randInt(10, 50), nm = pick(NAMES);
    return makeNum('integers', `${nm}'s account balance is -$${-bal}, which means ${nm} owes $${-bal}. A deposit of $${dep} is made. What is the new balance in dollars?`, bal + dep,
      `${bal} + ${dep} = ${bal + dep}.`, { units: units('dollar'), hint: 'Enter a number of dollars (negative if still owing).' });
  }
  GENERATORS.integers = {
    6: [intsCompare, intsCompare, intsOrder, intsOpposite, intsAbs, intsFreezing],
    7: [intsAddSub7, intsAddSub7, intsAddSub7, intsContext7]

  // =====================================================================
  // NUMBER: number sense  (Gr 6: B1.1, B1.3-B1.6; Gr 7: B1.1-B1.7, B2.2)
  // =====================================================================
  const PLACE_NAMES = ['whole number', 'tenth', 'hundredth'];
  function roundDecimal() {
    const target = randInt(0, 2);
    const td = target === 2 ? 3 : randInt(target + 1, 3);
    const whole = randInt(0, 99);
    const F = randInt(0, Math.pow(10, td) - 1);
    const scale = Math.pow(10, td);

  function nz(lo, hi) { let v = 0; while (v === 0) v = randInt(lo, hi); return v; }

  // decimal-point shifting on strings (avoids floating point error): multiply str by 10^k
  function shiftDec(str, k) {
    const neg = str[0] === '-';
    const s = neg ? str.slice(1) : str;
    const ip = s.split('.')[0], fp = s.split('.')[1] || '';
    const digits = ip + fp;
    const point = ip.length + k;
    let out;
    if (point <= 0) out = '0.' + '0'.repeat(-point) + digits;
    else if (point >= digits.length) out = digits + '0'.repeat(point - digits.length);
    else out = digits.slice(0, point) + '.' + digits.slice(point);
    if (out.indexOf('.') > -1) out = out.replace(/0+$/, '').replace(/\.$/, '');
    out = out.replace(/^0+(?=\d)/, '');
    return (neg ? '-' : '') + out;
  }

    return makeNum('factors', `What is √${v}?`, k / 10, `${k / 10} × ${k / 10} = ${v}, so √${v} = ${k / 10}.`, { hint: 'Enter a decimal number.' });
  }
  function squareNegBase8() {
    const a = randInt(2, 12), bracket = Math.random() < 0.5;
    if (bracket) {
      return makeNum('factors', `Evaluate: (-${a})²`, a * a, `The bracket means the base is −${a}: (−${a}) × (−${a}) = ${a * a}.`, { hint: 'Enter an integer.' });
    }
    return makeNum('factors', `Evaluate: -${a}²`, -a * a, `Without brackets, only ${a} is squared: −(${a} × ${a}) = −${a * a}.`, { hint: 'Enter an integer.' });
  }
  function areaToSide8() {
    const r = randInt(2, 25), A = r * r;
    const t = randInt(1, 3);
    if (t === 1) return makeNum('factors', `A square has an area of ${A} cm². What is the length of one side, in cm?`, r, `Side = √${A} = ${r} cm.`, { units: units('cm') });
    if (t === 2) return makeNum('factors', `A square has an area of ${A} m². What is its perimeter, in m?`, 4 * r, `Side = √${A} = ${r} m. Perimeter = 4 × ${r} = ${4 * r} m.`, { units: units('m') });
    return makeNum('factors', `Solve x² = ${A}. Enter the positive solution.`, r, `x = √${A} = ${r}. (−${r} also works, but the positive solution is ${r}.)`, { hint: 'Enter the positive value of x.' });
  }
  function squareEval8() {
    const a = randInt(11, 25);
    return makeNum('factors', `What is ${a}²?`, a * a, `${a} × ${a} = ${a * a}.`);

  // ---------- fractions (B2.5, B2.6) ----------
  function randMixed(dmax) {
    for (;;) {
      const d = randInt(2, dmax || 8), n = randInt(1, d - 1), w = randInt(1, 4);
      if (gcd(n, d) === 1) return { N: w * d + n, D: d, txt: `${w} ${n}/${d}`, mixed: true };
    }
  }
  function randProper(dmax) {
    for (;;) {
      const d = randInt(2, dmax || 9), n = randInt(1, d - 1);
      if (gcd(n, d) === 1) return { N: n, D: d, txt: `${n}/${d}`, mixed: false };
    }
  }
  function toImproper(f) { return f.mixed ? `${f.txt} = ${f.N}/${f.D}` : null; }
  function convNote(...fs) {
    const parts = fs.map(toImproper).filter(Boolean);
    return parts.length ? `Write ${parts.join(' and ')} as improper fractions. ` : '';
  }
  function fracAddSub8() {
    for (;;) {
      const a = randMixed(8), b = Math.random() < 0.3 ? randProper(8) : randMixed(8);
      const op = pick(['+', '-']);
      const L = lcm(a.D, b.D), an = a.N * (L / a.D), bn = b.N * (L / b.D);
      if (op === '-' && an <= bn) continue;
      const rn = op === '+' ? an + bn : an - bn;
      return makeFrac('fractions', `${a.txt} ${op} ${b.txt} = ?`, rn, L,
        `${convNote(a, b)}Use a common denominator of ${L}: ${an}/${L} ${op} ${bn}/${L} = ${fracResultText(rn, L)}.`);
    }
  }
  function fracMulDiv8(op) {
    const kinds = pick([['mixed', 'proper'], ['mixed', 'mixed'], ['proper', 'mixed'], ['whole', 'mixed'], ['mixed', 'whole'], ['proper', 'proper'], ['proper', 'whole']]);
    const mk = k => k === 'mixed' ? randMixed(6) : k === 'proper' ? randProper(8) : (w => ({ N: w, D: 1, txt: String(w), mixed: false }))(randInt(2, 9));
    const a = mk(kinds[0]), b = mk(kinds[1]);
    if (op === '×') {
      return makeFrac('fractions', `${a.txt} × ${b.txt} = ?`, a.N * b.N, a.D * b.D,
        `${convNote(a, b)}Multiply the numerators and the denominators: (${a.N} × ${b.N}) / (${a.D} × ${b.D}) = ${fracResultText(a.N * b.N, a.D * b.D)}.`);
    }
    return makeFrac('fractions', `${a.txt} ÷ ${b.txt} = ?`, a.N * b.D, a.D * b.N,
      `${convNote(a, b)}Multiply by the reciprocal of ${b.mixed ? b.N + '/' + b.D : b.txt}: ${a.N}/${a.D} × ${b.D}/${b.N} = ${fracResultText(a.N * b.D, a.D * b.N)}.`);
  }
  function fracWord8() {
    const nm = pick(NAMES), t = randInt(1, 4);
    if (t === 1) {
      const a = randMixed(8), b = randMixed(8), L = lcm(a.D, b.D);
      const rn = a.N * (L / a.D) + b.N * (L / b.D);
      return makeFrac('fractions', `${nm} walked ${a.txt} km in the morning and ${b.txt} km in the afternoon. How far did ${nm} walk altogether, in km?`, rn, L,
        `${convNote(a, b)}Add with a common denominator of ${L}: ${a.N * (L / a.D)}/${L} + ${b.N * (L / b.D)}/${L} = ${fracResultText(rn, L)} km.`, { hint: 'Enter a fraction or mixed number of km.' });
    }
    if (t === 2) {
      for (;;) {
        const a = randMixed(8), b = randMixed(8), L = lcm(a.D, b.D);
        const an = a.N * (L / a.D), bn = b.N * (L / b.D);
        if (an <= bn) continue;
        return makeFrac('fractions', `A board is ${a.txt} m long. ${nm} cuts off a piece that is ${b.txt} m long. How much of the board is left, in m?`, an - bn, L,
          `${convNote(a, b)}Subtract with a common denominator of ${L}: ${an}/${L} − ${bn}/${L} = ${fracResultText(an - bn, L)} m.`, { hint: 'Enter a fraction or mixed number of m.' });
      }
    }
    if (t === 3) {
      const a = randMixed(6), b = randMixed(6);
      return makeFrac('fractions', `A recipe needs ${a.txt} cups of flour. ${nm} makes ${b.txt} times the recipe. How many cups of flour are needed?`, a.N * b.N, a.D * b.D,
        `${convNote(a, b)}Multiply: ${a.N}/${a.D} × ${b.N}/${b.D} = ${fracResultText(a.N * b.N, a.D * b.D)} cups.`, { hint: 'Enter a fraction or mixed number of cups.' });
    }
    const p = Math.random() < 0.5 ? randProper(8) : randMixed(6), k = randInt(2, 9);
    const r = reduceFrac(p.N * k, p.D);
    return makeFrac('fractions', `A ribbon is ${mixedStr(r.n, r.d)} m long. It is cut into pieces that are each ${p.txt} m long. How many pieces are there?`, k, 1,
      `Divide: ${mixedStr(r.n, r.d)} ÷ ${p.txt}. As improper fractions: ${r.n}/${r.d} ÷ ${p.N}/${p.D} = ${r.n}/${r.d} × ${p.D}/${p.N} = ${k}.`, { hint: 'Enter a whole number.' });
  }

  // ---------- decimals (B2.3 mental math with powers of ten) ----------
  function decShift8() {
    const dp = randInt(0, 3);
    let x = String(randInt(1, 9999) / Math.pow(10, dp));
    if (x.indexOf('e') > -1) x = '1.5';
    const t = randInt(1, 4);
    let k, expr, how;
    if (t === 1 || t === 2) {
      const e = randInt(1, 4);
      const pw = e === 1 || Math.random() < 0.4 ? String(Math.pow(10, e)) : `10${sup(e)}`;
      if (t === 1) { k = e; expr = `${x} × ${pw}`; how = `Multiplying by ${Math.pow(10, e)} moves the decimal point ${e} place${e > 1 ? 's' : ''} to the right`; }
      else { k = -e; expr = `${x} ÷ ${pw}`; how = `Dividing by ${Math.pow(10, e)} moves the decimal point ${e} place${e > 1 ? 's' : ''} to the left`; }
    } else if (t === 3) {
      const e = randInt(1, 3), m = e === 1 ? '0.1' : e === 2 ? '0.01' : '0.001';
      k = -e; expr = `${x} × ${m}`; how = `Multiplying by ${m} is the same as dividing by ${Math.pow(10, e)}, so the decimal point moves ${e} place${e > 1 ? 's' : ''} to the left`;
    } else {
      const e = randInt(1, 2), m = e === 1 ? '0.1' : '0.01';
      k = e; expr = `${x} ÷ ${m}`; how = `Dividing by ${m} is the same as multiplying by ${Math.pow(10, e)}, so the decimal point moves ${e} place${e > 1 ? 's' : ''} to the right`;
    }
    const res = shiftDec(x, k);
    if (Math.abs(Number(res)) < 1e-6 && Number(res) !== 0) return decShift8();
    return makeNum('decimals', `${expr} = ?`, Number(res), `${how}: ${expr} = ${res}.`, { tol: Math.abs(Number(res)) * 1e-9, display: gridNum(res), hint: 'Enter a number (no spaces).' });
  }
  function decMulti8() {
    const nm = pick(NAMES), t = randInt(1, 3);
    if (t === 1) {
      const n = randInt(2, 5), p = randInt(150, 495) / 100, q = randInt(100, 399) / 100;
      const total = r6(n * p + q), cash = Math.ceil(total / 5) * 5;
      return makeNum('decimals', `${nm} buys ${n} notebooks at $${p.toFixed(2)} each and a pen for $${q.toFixed(2)}. ${nm} pays with $${cash}. How much change should ${nm} get, in dollars?`, r6(cash - total),
        `Cost: ${n} × ${p.toFixed(2)} = ${n2s(r6(n * p))}, then + ${q.toFixed(2)} = ${n2s(total)}. Change: ${cash} − ${n2s(total)} = ${n2s(r6(cash - total))}.`, { units: units('dollar'), hint: 'Enter an amount in dollars.' });
    }
    if (t === 2) {
      const p = randInt(2, 9) / 10, n = randInt(4, 20), total = r6(n * p);
      return makeNum('decimals', `A bag holds ${total} kg of flour. ${nm} divides it into portions of ${p} kg each. How many portions are there?`, n,
        `${total} ÷ ${p} = ${n}. (Multiply both numbers by 10: ${n2s(total * 10)} ÷ ${n2s(p * 10)} = ${n}.)`, { hint: 'Enter a whole number.' });
    }
    const km = randInt(20, 90) / 10, rate = pick([0.5, 1.5, 2.5, 0.8, 1.2]), fixed = pick([3, 3.5, 4.5, 5]);
    const total = r6(fixed + rate * km);
    return makeNum('decimals', `A taxi charges $${fixed.toFixed(2)} plus $${rate.toFixed(2)} per km. What is the fare for a ${km} km trip, in dollars?`, total,
      `${rate.toFixed(2)} × ${km} = ${n2s(r6(rate * km))}. Then ${fixed.toFixed(2)} + ${n2s(r6(rate * km))} = ${n2s(total)}.`, { units: units('dollar'), hint: 'Enter an amount in dollars.', tol: 0.005 });
  }

  // ---------- percents (B1.4) ----------
  function pctBeyond8() {
    if (Math.random() < 0.55) {
      const p = pick([110, 125, 150, 175, 200, 250, 300]), base = randInt(1, 20) * 20;
      return makeNum('percentages', `What is ${p}% of ${base}?`, p * base / 100,
        `${p}% = ${p / 100}. ${p / 100} × ${base} = ${p * base / 100}. (A percent over 100% gives more than the original amount.)`, { hint: 'Enter a number.' });
    }
    const p = pick([0.5, 0.25, 0.1, 0.2, 0.75]), base = randInt(1, 10) * 400;
    const v = r6(p * base / 100);
    return makeNum('percentages', `What is ${p}% of ${base}?`, v,
      `${p}% = ${p}/100 = ${n2s(p / 100)}. ${n2s(p / 100)} × ${base} = ${n2s(v)}. (A percent under 1% is a very small part of the amount.)`, { hint: 'Enter a number.', tol: 1e-6 });
  }
  function pctWhole8() {
    const p = pick([5, 10, 12, 15, 20, 25, 30, 40, 60, 75, 120, 150]);
    const g = gcd(p, 100), whole = (100 / g) * randInt(1, 10), part = whole * p / 100;
    return makeNum('percentages', `${part} is ${p}% of what number?`, whole,
      `${p}% of the number is ${part}. So 1% is ${n2s(part / p)}, and 100% is ${n2s(part / p)} × 100 = ${whole}.`, { hint: 'Enter a number.' });
  }
  function pctSuccessive8() {
    const t = randInt(1, 3);
    if (t === 1) {
      const price = randInt(2, 15) * 20, d = pick([10, 15, 20, 25, 30, 40, 50]);
      const sale = price * (100 - d) / 100, total = r6(sale * 1.13);
      return makeNum('percentages', `A jacket costs $${price}. It is on sale for ${d}% off, and then 13% HST is added to the sale price. What is the final cost, in dollars?`, total,
        `Sale price: ${price} × ${(100 - d) / 100} = ${sale}. With tax: ${sale} × 1.13 = ${n2s(total)}.`, { units: units('dollar'), hint: 'Enter an amount in dollars.', tol: 0.005 });
    }
    if (t === 2) {
      const price = randInt(1, 12) * 20, p = pick([10, 20, 25, 40, 50]);
      const up = price * (100 + p) / 100, fin = r6(up * (100 - p) / 100);
      return makeNum('percentages', `A price of $${price} is increased by ${p}%. Then the new price is decreased by ${p}%. What is the final price, in dollars?`, fin,
        `After the increase: ${price} × ${(100 + p) / 100} = ${n2s(up)}. After the decrease: ${n2s(up)} × ${(100 - p) / 100} = ${n2s(fin)}. (It is not back to $${price}, because the ${p}% is taken from a different amount.)`,
        { units: units('dollar'), hint: 'Enter an amount in dollars.', tol: 0.005 });
    }
    const old = randInt(1, 15) * 20, p = pick([5, 10, 15, 20, 25, 30, 40, 50, 60, 75, 80]);
    const inc = Math.random() < 0.5, nw = old * (100 + (inc ? p : -p)) / 100;
    return makeNum('percentages', `The price of a game ${inc ? 'rose' : 'fell'} from $${old} to $${nw}. What is the percent ${inc ? 'increase' : 'decrease'}?`, p,
      `Change = ${Math.abs(nw - old)}. Percent ${inc ? 'increase' : 'decrease'} = ${Math.abs(nw - old)} ÷ ${old} × 100 = ${p}%.`, { hint: 'Enter a number (the percent), e.g. 25 for 25%.', display: `${p}%` });
  }

  // ---------- ratios, rates, proportions (B2.8) ----------
  function ratioThree8() {
    const parts = [randInt(1, 6), randInt(1, 6), randInt(1, 6)];
    if (parts[0] === parts[1] && parts[1] === parts[2]) parts[2] += 1;
    const k = randInt(2, 8), nm = pick(NAMES);
    const names = shuffle(['red', 'blue', 'white']);
    const known = randInt(0, 2); let ask = randInt(0, 2);
    while (ask === known) ask = randInt(0, 2);
    return makeNum('ratios', `Paint is mixed in the ratio ${names.join(' : ')} = ${parts.join(' : ')}. ${nm} uses ${parts[known] * k} L of ${names[known]} paint. How many litres of ${names[ask]} paint are needed?`, parts[ask] * k,
      `${names[known]} is ${parts[known]} ${plural(parts[known], 'part', 'parts')} = ${parts[known] * k} L, so 1 part = ${parts[known] * k} ÷ ${parts[known]} = ${k} L. ${names[ask]} is ${parts[ask]} ${plural(parts[ask], 'part', 'parts')}: ${parts[ask]} × ${k} = ${parts[ask] * k} L.`, { units: units('L') });
  }
  function rateCompare8() {
    for (let i = 0; i < 100; i++) {
      const t1 = randInt(2, 6), t2 = randInt(2, 6), d1 = randInt(80, 400), d2 = randInt(80, 400);
      const r1 = d1 / t1, r2 = d2 / t2;
      if (Math.abs(r1 - r2) < 2) continue;
      const ans = r1 > r2 ? 'A' : 'B';
      return makeText('ratios', `Car A travels ${d1} km in ${t1} hours. Car B travels ${d2} km in ${t2} hours. Which car has the greater average speed? Type A or B.`, [ans.toLowerCase(), 'car ' + ans.toLowerCase()], ans,
        `Car A: ${d1} ÷ ${t1} = ${n2s(Math.round(r1 * 100) / 100)} km/h. Car B: ${d2} ÷ ${t2} = ${n2s(Math.round(r2 * 100) / 100)} km/h. Car ${ans} is faster.`, { hint: 'Type A or B.' });
    }
    return rateCompare8();
  }
  function rateConvert8() {
    if (Math.random() < 0.5) {
      const v = randInt(1, 12) * 3;
      return makeNum('ratios', `A cyclist rides at ${v} km/h. How many metres does the cyclist travel in one minute?`, v * 1000 / 60,
        `${v} km = ${v * 1000} m in 60 minutes. ${v * 1000} ÷ 60 = ${n2s(v * 1000 / 60)} m per minute.`, { units: units('m'), hint: 'Enter a number of metres.' });
    }
    const v = randInt(2, 15);
    return makeNum('ratios', `A runner's speed is ${v} m/s. What is the speed in km/h?`, r6(v * 3.6),
      `In 1 hour there are 3600 seconds, so ${v} × 3600 = ${v * 3600} m = ${n2s(v * 3.6)} km. The speed is ${n2s(r6(v * 3.6))} km/h.`, { units: units('kmh'), hint: 'Enter a number of km/h.', tol: 0.01 });
  }
  function proportionRate8() {
    const nm = pick(NAMES);
    const u = pick([0.25, 0.5, 0.75, 1.5, 2.5]), b = randInt(2, 12);
    let c = randInt(2, 30); while (c === b) c = randInt(2, 30);
    const a = r6(u * b);
    return makeNum('ratios', `${nm}'s recipe uses ${n2s(a)} cups of rice for ${b} servings. At the same rate, how many cups of rice are needed for ${c} servings?`, r6(u * c),
      `Unit rate: ${n2s(a)} ÷ ${b} = ${n2s(u)} cups per serving. ${c} × ${n2s(u)} = ${n2s(r6(u * c))} cups.`, { hint: 'Enter a number of cups.' });
  }

  // ---------- order of operations (B2.1) ----------
  function fr(n, d) { const g = gcd(n, d); return [n / g, d / g]; }
  function opsExpr8() {
    const t = randInt(1, 7);
    if (t === 1) {
      const a = randInt(-9, 9), b = randInt(2, 6), c = randInt(1, 12), d = randInt(1, 12);
      if (c === d) return opsExpr8();
      const inner = c - d, prod = b * inner, val = a + prod;
      return makeNum('orderops', `${a} + ${b} × (${c} − ${d}) = ?`, val,
        `Brackets first: ${c} − ${d} = ${inner}. Then multiply: ${b} × ${fmtSigned(inner)} = ${prod}. Then add: ${a} + ${fmtSigned(prod)} = ${val}.`, { hint: 'Enter an integer.' });
    }
    if (t === 2) {
      const b = randInt(2, 9), sq = b * b, divs = [];
      for (let k = 2; k <= sq; k++) if (sq % k === 0 && k < sq) divs.push(k);
      const c = pick(divs), a = randInt(1, 30), val = a - sq / c;
      return makeNum('orderops', `${a} − ${b}² ÷ ${c} = ?`, val,
        `Exponent first: ${b}² = ${sq}. Divide: ${sq} ÷ ${c} = ${sq / c}. Subtract: ${a} − ${sq / c} = ${val}.`, { hint: 'Enter an integer.' });
    }
    if (t === 3) {
      const k = randInt(2, 12), a = randInt(2, 9), b = randInt(2, 9), val = k + a * b;
      return makeNum('orderops', `√${k * k} + ${a} × ${b} = ?`, val,
        `Square root first: √${k * k} = ${k}. Multiply: ${a} × ${b} = ${a * b}. Add: ${k} + ${a * b} = ${val}.`, { hint: 'Enter a whole number.' });
    }
    if (t === 4) {
      const c = pick([2, 3, 4, 5, 6]), m = randInt(1, 4), diff = c * m, b = randInt(1, 10), a = b + diff;
      const d = randInt(1, 15), val = (diff * diff) / c + d;
      return makeNum('orderops', `(${a} − ${b})² ÷ ${c} + ${d} = ?`, val,
        `Brackets: ${a} − ${b} = ${diff}. Exponent: ${diff}² = ${diff * diff}. Divide: ${diff * diff} ÷ ${c} = ${diff * diff / c}. Add: ${diff * diff / c} + ${d} = ${val}.`, { hint: 'Enter an integer.' });
    }
    if (t === 5) {
      const a = nz(-9, -2), b = randInt(2, 9), d = randInt(2, 6), q = randInt(2, 9), c = d * q;
      const val = a * b + c / d;
      return makeNum('orderops', `(${a}) × ${b} + ${c} ÷ ${d} = ?`, val,
        `Multiply and divide before adding: (${a}) × ${b} = ${a * b} and ${c} ÷ ${d} = ${q}. Then ${a * b} + ${q} = ${val}.`, { hint: 'Enter an integer.' });
    }
    if (t === 6) {
      const x = pick([0.5, 1.5, 2.5, 3.5, 4.5, 2, 3, 4]), y = randInt(11, 59) / 10, z = randInt(11, 59) / 10;
      const sum = r6(y + z), val = r6(x * sum);
      return makeNum('orderops', `${x} × (${y} + ${z}) = ?`, val,
        `Brackets first: ${y} + ${z} = ${n2s(sum)}. Multiply: ${x} × ${n2s(sum)} = ${n2s(val)}.`, { hint: 'Enter a decimal number.', tol: 0.005 });
    }
    const [n1, d1] = [randInt(1, 3), pick([2, 3, 4, 5, 6])], [n2, d2] = [randInt(1, 3), pick([2, 3, 4, 5, 6])], [n3, d3] = [randInt(1, 3), pick([2, 3, 4, 5, 6])];
    if (n1 >= d1 || n2 >= d2 || n3 >= d3) return opsExpr8();
    const mn = n2 * n3, md = d2 * d3;
    const L = lcm(d1, md), sn = n1 * (L / d1) + mn * (L / md);
    return makeFrac('orderops', `${n1}/${d1} + ${n2}/${d2} × ${n3}/${d3} = ?`, sn, L,
      `Multiply first: ${n2}/${d2} × ${n3}/${d3} = ${fracResultText(mn, md)}. Then add: ${n1}/${d1} + ${fracStr(...fr(mn, md))} = ${fracResultText(sn, L)}.`);
  }

  // ---------- patterns (C1.1-C1.3) ----------
  function pattTable8() {
    const r = pick([-6, -5, -4, -3, -2, 2, 3, 4, 5, 6, -1.5, 2.5, 3.5, 0.5, -0.5, 1.5]);
    const b = randInt(-8, 40), val = n => r6(b + r * n);
    const rows = [1, 2, 3, 4].map(n => [String(n), n2s(val(n))]);
    const vis = htmlTable(['Term number', 'Value'], rows);
    const kind = r > 0 ? 'growing' : 'shrinking';
    const t = randInt(1, 4);
    if (t === 1) {
      return makeNum('patterns', `The table shows a ${kind} linear pattern. What is the constant rate of change?`, r,
        `The value changes by ${n2s(val(2))} − ${fmtSigned(val(1))} = ${n2s(r)} from one term to the next, so the constant rate of change is ${n2s(r)}.`, { visual: vis, hint: 'Enter a number (negative if the pattern is shrinking).' });
    }
    if (t === 2) {
      return makeNum('patterns', `The table shows a ${kind} linear pattern. What is the initial value (the value at term 0)?`, b,
        `The rate of change is ${n2s(r)}. Go back one term from term 1: ${n2s(val(1))} − ${fmtSigned(r)} = ${n2s(b)}. The initial value is ${n2s(b)}.`, { visual: vis, hint: 'Enter a number.' });
    }
    if (t === 3) {

  // ---------- coordinates (E1.4) ----------
  function evenPts(pts) { return pts.every(p => p[0] % 2 === 0 && p[1] % 2 === 0); }
  function coordPoly8() {
    for (let tries = 0; tries < 300; tries++) {
      const V = [randPoint(6), randPoint(6), randPoint(6)];
      const area2 = (V[1][0] - V[0][0]) * (V[2][1] - V[0][1]) - (V[2][0] - V[0][0]) * (V[1][1] - V[0][1]);
      if (area2 === 0) continue;

        const before = cur[which].slice();
        if (k === 'translate') {

        } else if (k === 'rotate') {
          const a = pick([90, 180, 270]);

        } else {
          const f = evenPts(cur) && Math.random() < 0.5 ? 0.5 : pick([2, 3]);

          desc.push(`dilated about the origin by a scale factor of ${f === 0.5 ? '1/2' : f}`);

      return makePoint('coordinates', `Triangle ABC has vertices A${ptStr(V[0])}, B${ptStr(V[1])} and C${ptStr(V[2])}. It is ${desc.join(', and then ')}. What are the coordinates of ${labels[which]}′ in the final image?`, img[0], img[1],
        `Follow vertex ${labels[which]} through each step. ${steps.map((s, i) => `Step ${i + 1}, ${s}.`).join(' ')}`,
        { visual: svgPlane(V.map((p, i) => ({ x: p[0], y: p[1], label: labels[i] }))) });
    }
    return coordPoly8();
  }

  // ---------- measurement (E2.1, E2.3, E2.4) ----------
  const METRIC_PREFIX = [['tera', 12], ['giga', 9], ['mega', 6], ['kilo', 3], ['', 0], ['milli', -3], ['micro', -6], ['nano', -9], ['pico', -12]];
  function metric8() {
    const unit = pick(['metre', 'gram', 'litre', 'byte']);
    const pool = METRIC_PREFIX.filter(p => unit !== 'byte' || p[1] >= 0);
    const t = randInt(1, 4);
    if (t === 1) {
      const p = pick(pool.filter(p => p[1] !== 0));
      return makeNum('measurement', `1 ${p[0]}${unit} is 10 to what power of one ${unit}? Enter the exponent.`, p[1],
        `The prefix "${p[0]}" means 10${supInt(p[1])}. So 1 ${p[0]}${unit} = 10${supInt(p[1])} ${unit}s. The exponent is ${p[1]}.`, { hint: 'Enter an integer (negative for small units).' });
    }
    let a, b;
    do { a = pick(pool); b = pick(pool); } while (a[1] === b[1] || Math.abs(a[1] - b[1]) < 3 || Math.abs(a[1] - b[1]) > 9);
    const q = pick(['1', '2', '3', '5', '2.5', '4.5', '0.5', '7']);
    const [big, small] = a[1] > b[1] ? [a, b] : [b, a], diff = big[1] - small[1];
    const pl = (p, num) => `${p[0]}${unit}${num === '1' ? '' : 's'}`;
    if (t === 2 || t === 3) {
      const res = shiftDec(q, diff);
      return makeNum('measurement', `Convert ${q} ${pl(big, q)} to ${small[0]}${unit}s.`, Number(res),
        `1 ${big[0]}${unit} = 10${supInt(big[1])} ${unit}s and 1 ${small[0] ? small[0] + unit : unit} = 10${supInt(small[1])} ${unit}s, so 1 ${big[0]}${unit} = 10${sup(diff)} ${small[0]}${unit}s. ${q} × 10${sup(diff)} = ${res}.`,
        { tol: Math.abs(Number(res)) * 1e-9, display: gridNum(res), hint: 'Enter a number (no spaces).' });
    }
    const res = shiftDec(q, -diff);
    if (Number(res) < 1e-6) return metric8();
    return makeNum('measurement', `Convert ${q} ${pl(small, q)} to ${big[0]}${unit}s.`, Number(res),
      `1 ${small[0]}${unit} = 10${supInt(-diff)} ${big[0]}${unit}s, so divide by 10${sup(diff)}: ${q} ÷ 10${sup(diff)} = ${res}.`,
      { tol: Math.abs(Number(res)) * 1e-9, display: gridNum(res), hint: 'Enter a number (no spaces).' });
  }
  const TRIPLES = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29]];

  const SVG_FONT = 'font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"';
  function svgOpen(w, h, extra) { return `<svg viewBox="0 0 ${w} ${h}" width="${Math.min(w, 360)}" role="img" ${SVG_FONT} ${extra || ''}>`; }
  const INK = '#1a2332', SOFT = '#e2e8f2', MUTED = '#6b7488';

  // rows of counters (groups of five are spaced apart so they are easy to count)
  function svgDots(n, o = {}) {
    const per = o.perRow || 10, r = 9, gap = 26, pad = 14, rows = Math.ceil(n / per);
    const W = pad * 2 + per * gap + 10, H = pad * 2 + rows * gap;
    let s = svgOpen(W, H, `data-count="${n}"`);

  }
  // ten frames (2 x 5), filled left to right

    let s = svgOpen(W, H, `data-count="${n}"`), k = 0;
    for (let f = 0; f < frames; f++) {
      const x0 = pad + f * (5 * cell + 16);
      s += `<rect x="${x0}" y="${pad}" width="${5 * cell}" height="${2 * cell}" fill="#fff" stroke="${INK}" stroke-width="1.5" />`;
      for (let i = 1; i < 5; i++) s += `<line x1="${x0 + i * cell}" y1="${pad}" x2="${x0 + i * cell}" y2="${pad + 2 * cell}" stroke="${INK}" />`;
      s += `<line x1="${x0}" y1="${pad + cell}" x2="${x0 + 5 * cell}" y2="${pad + cell}" stroke="${INK}" />`;
      for (let i = 0; i < 10 && k < n; i++, k++) {
        s += `<circle cx="${x0 + (i % 5) * cell + cell / 2}" cy="${pad + Math.floor(i / 5) * cell + cell / 2}" r="10" fill="${COLORS[0]}" />`;
